<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBCS Premium Geography Mock Test - WBCS With Tanmoy</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* ===================================================
           DEEP VIBRANT PORTAL (100% FIXED - 25 GEOGRAPHY TOPICS)
        =================================================== */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }

        body { background: #eaf0f6; }

        .quiz-super-container {
            width: 94%;
            max-width: 960px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 4px solid #ced6e0;
            overflow: hidden;
        }

        /* Top Bar - Deep Dark Navy */
        .quiz-header-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #0a183d; 
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d63031;
        }

        .timer-badge {
            background: #ff4757;
            color: white;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .question-tracker {
            background: #1e90ff;
            color: white;
            font-weight: 900;
            padding: 8px 22px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .score-badge {
            background: #009432;
            color: white;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .quiz-body { padding: 35px 40px; }

        .question-display-card {
            background: #0c2461;
            color: #ffffff;
            border: 4px solid #4a69bd;
            padding: 25px 30px;
            border-radius: 16px;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 35px;
            line-height: 1.5;
            box-shadow: 0 8px 20px rgba(12, 36, 97, 0.4);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 20px;
        }

        .option-item {
            background: #ffffff;
            border: 3px solid #70a1ff;
            border-left: 8px solid #1e90ff;
            padding: 18px 22px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 800;
            color: #2f3542;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .opt-correct {
            background: #009432 !important;
            color: white !important;
            border: 3px solid #004015 !important;
            border-left: 8px solid #00260c !important;
            box-shadow: 0 6px 15px rgba(0, 148, 50, 0.4) !important;
        }

        .opt-wrong {
            background: #d63031 !important;
            color: white !important;
            border: 3px solid #801d1d !important;
            border-left: 8px solid #4d1111 !important;
            box-shadow: 0 6px 15px rgba(214, 48, 49, 0.4) !important;
        }

        .disabled-opt { pointer-events: none; }

        .quiz-footer { margin-top: 40px; padding-top: 20px; }

        .next-action-btn {
            width: 100%;
            background: #d63031;
            color: white;
            border: none;
            border-bottom: 5px solid #8c1d1d; 
            padding: 18px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            display: block; 
            box-shadow: 0 8px 20px rgba(214, 48, 49, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .next-action-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* Result Screen */
        .result-container { display: none; text-align: center; padding: 80px 20px; }
        .result-container h2 { font-size: 35px; color: #0c2461; font-weight:900; margin-bottom: 20px; }
        .result-score-txt { font-size: 65px; font-weight: 900; color: #009432; margin-bottom: 35px; }

        @media screen and (max-width: 768px) {
            .quiz-super-container { width: 100%; margin: 0 auto; border-radius: 0; border: none; }
            .quiz-header-bar { padding: 14px 15px; }
            .timer-badge, .question-tracker, .score-badge { padding: 6px 12px; font-size: 15px; }
            
            .quiz-body { padding: 25px 18px; }
            .question-display-card { font-size: 19px; padding: 20px; margin-bottom: 25px; }
            
            .options-grid { grid-template-columns: 1fr; gap: 14px; }
            .option-item { padding: 16px 20px; font-size: 16px; }
            
            .next-action-btn { padding: 16px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <header class="top-header">
    <div class="header-side left-wing">
        <span class="target-badge">🎯 Mission WBCS </span>
    </div>

    <div class="header-center">
        <img src="logo.png" alt="Wbcs with Tanmoy" class="top-logo">
        <h1 class="main-title">WBCS WITH TANMOY</h1>
    </div>

    <div class="header-side right-wing">
        <span class="free-badge">🏷️ 100% Free Portal</span>
    </div>
</header>
    <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="index.html">Notes</a>
        <a href="https://drive.google.com/drive/folders/1xMzQB4SyceBRpZ4D2lC6p97Y64Jwjamy?usp=drive_link" target="_blank">Syllabus</a>
        <a href="https://drive.google.com/drive/folders/1nXT_2jDf4UpzG0d_zwPrDGf4nYcMUpVm?usp=sharing" target="_blank">Pyq</a>
        <a href="https://drive.google.com/drive/folders/1oF85zmZwjae4ZLavy61dbq8Eda19Eksd?usp=drive_link" target="_blank">Books</a>
        <a href="mocktest.html" style="color: #e74c3c;">Mock Test</a>
    </nav>

    <div class="quiz-super-container">
        
        <div id="active-quiz-portal">
            <div class="quiz-header-bar">
                <div class="timer-badge">⏱ <span id="time-txt">30</span>s</div>
                <div class="question-tracker" id="tracker-txt">প্রশ্ন: ১ / ২৫</div>
                <div class="score-badge">Score: <span id="score-txt">0</span></div>
            </div>

            <div class="quiz-body">
                <div class="question-display-card" id="q-txt"></div>
                
                <div class="options-grid" id="opts-area"></div>

                <div class="quiz-footer">
                    <button class="next-action-btn" onclick="triggerNext()">পরের প্রশ্ন ➔</button>
                </div>
            </div>
        </div>

        <div class="result-container" id="result-portal">
            <h2>মক টেস্ট সমাপ্ত! 🎉</h2>
            <div class="result-score-txt" id="final-score-display">0 / 0</div>
            <a href="mocktest.html" style="background:#0c2461; color:white; padding:16px 45px; border-radius:30px; text-decoration:none; font-weight:900; font-size:18px; display:inline-block;">মেইন মেনু</a>
        </div>

    </div>

    <script>
        // ২৫টি বাছাই করা "WBCS Geography" (Indian + West Bengal Geography)
        const questionsList = [
            { question: "১. ভারতের দীর্ঘতম নদী গঙ্গার মোট দৈর্ঘ্য কত?", options: ["২৫০০ কিমি", "২৫২৫ কিমি", "২৬০০ কিমি", "২৭২৫ কিমি"], correct: 1 },
            { question: "২. পশ্চিমবঙ্গের সর্বোচ্চ শৃঙ্গ 'সান্দাকফু' কোন পর্বতশ্রেণীর অন্তর্গত?", options: ["দার্জিলিং", "সিঙ্গালিলা", "চোলা", "জয়ন্তী"], correct: 1 },
            { question: "৩. কর্কটক্রান্তি রেখা (Tropic of Cancer) পশ্চিমবঙ্গের মোট কয়টি জেলার ওপর দিয়ে বিস্তৃত?", options: ["৩টি", "৪টি", "৫টি", "৬টি"], correct: 2 },
            { question: "৪. ভারতের 'সিলিকন ভ্যালি' (Silicon Valley) কাকে বলা হয়?", options: ["হায়দরাবাদ", "বেঙ্গালুরু", "চেন্নাই", "পুনে"], correct: 1 },
            { question: "৫. দক্ষিণ ভারতের কোন নদীকে 'বৃদ্ধ গঙ্গা' (Vridha Ganga) বা 'দক্ষিণ গঙ্গা' বলা হয়?", options: ["কৃষ্ণা", "কাবেরী", "গোদাবরী", "নর্মদা"], correct: 2 },
            { question: "৬. পশ্চিমবঙ্গের কোথায় সর্বাধিক বৃষ্টিপাত হয়?", options: ["দার্জিলিং", "বক্সা ডুয়ার্স (আলিপুরদুয়ার)", "কালিম্পং", "শিলিগুড়ি"], correct: 1 },
            { question: "৭. মাজুলী (Majuli) নদী-দ্বীপটি কোন রাজ্যে ও কোন নদীতে অবস্থিত?", options: ["আসাম (ব্রহ্মপুত্র)", "পশ্চিমবঙ্গ (গঙ্গা)", "কেরালা (পেরিয়ার)", "বিহার (কোশী)"], correct: 0 },
            { question: "৮. বিখ্যাত 'নাথুলা পাস' (Nathu La Pass) ভারতের কোন রাজ্যে অবস্থিত?", options: ["হিমাচল প্রদেশ", "উত্তরাখণ্ড", "সিকিম", "অরুণাচল প্রদেশ"], correct: 2 },
            { question: "৯. ভারতের প্রাচীনতম ভঙ্গিল পর্বতমালা (Oldest Fold Mountain) কোনটি?", options: ["হিমালয়", "বিন্ধ্য", "আরাবল্লী", "সাতপুরা"], correct: 2 },
            { question: "১০. 'বাংলার দুঃখ' নামে পরিচিত দামোদর নদ কোথা থেকে উৎপন্ন হয়েছে?", options: ["অমরকণ্টক শৃঙ্গ", "ছোটনাগপুর মালভূমি", "মহাবালেশ্বর শৃঙ্গ", "ত্র্যম্বক উচ্চভূমি"], correct: 1 },
            { question: "১১. ভারতের কোন রাজ্যে আয়তনের বিচারে সর্বাধিক বনভূমি (Forest cover) রয়েছে?", options: ["অরুণাচল প্রদেশ", "ছত্তিশগড়", "মধ্যপ্রদেশ", "মিজোরাম"], correct: 2 },
            { question: "১২. সুন্দরবনকে কত সালে 'ইউনেস্কো ওয়ার্ল্ড হেরিটেজ সাইট' ঘোষণা করা হয়?", options: ["১৯৮৪ সালে", "১৯৮৭ সালে", "১৯৯২ সালে", "১৯৯৭ সালে"], correct: 1 },
            { question: "১৩. ভারতের কোন রাজ্যে সবথেকে বেশি কফি উৎপাদিত হয়?", options: ["কেরালা", "তামিলনাড়ু", "কর্ণাটক", "আসাম"], correct: 2 },
            { question: "১৪. দক্ষিণ ভারতের নীলগিরি পর্বতের সর্বোচ্চ শৃঙ্গ কোনটি?", options: ["আনাইমুদি", "দোদাবেতা", "মহেন্দ্রগিরি", "অগস্ত্যমালাই"], correct: 1 },
            { question: "১৫. ভারতের 'গোলাপি শহর' (Pink City) কাকে বলা হয়?", options: ["যোধপুর", "উদয়পুর", "জয়পুর", "আজমের"], correct: 2 },
            { question: "১৬. আরব সাগরে অবস্থিত 'লাক্ষাদ্বীপ' (Lakshadweep) মূলত কী ধরনের দ্বীপ?", options: ["আগ্নেয় দ্বীপ", "প্রবাল দ্বীপ (Coral Island)", "পলিগঠিত দ্বীপ", "বদ্বীপ"], correct: 1 },
            { question: "১৭. মহানদীর ওপর নির্মিত ভারতের দীর্ঘতম বাঁধ (Longest Dam) কোনটি?", options: ["ভাকরা নাঙ্গাল", "তেহরি বাঁধ", "হিরাকুদ বাঁধ", "নাগার্জুন সাগর"], correct: 2 },
            { question: "১৮. পশ্চিমবঙ্গের সাথে ভারতের মোট কয়টি রাজ্যের সীমানা যুক্ত রয়েছে?", options: ["৩টি", "৪টি", "৫টি", "৬টি"], correct: 2 },
            { question: "১৯. খনিজ সম্পদে সমৃদ্ধ হওয়ায় কাকে 'ভারতের রূঢ়' (Ruhr of India) বলা হয়?", options: ["আসানসোল", "জামশেদপুর", "দুর্গাপুর", "ভিলাই"], correct: 2 },
            { question: "২০. দাক্ষিণাত্য মালভূমির 'ডেকান ট্র্যাপ' মূলত কোন শিলা দ্বারা গঠিত?", options: ["গ্রানাইট", "ব্যাসল্ট", "নিস", "বেলেপাথর"], correct: 1 },
            { question: "২১. আন্দামান ও নিকোবর দ্বীপপুঞ্জকে পরস্পর থেকে বিচ্ছিন্ন করেছে কোনটি?", options: ["৮ ডিগ্রি চ্যানেল", "৯ ডিগ্রি চ্যানেল", "১০ ডিগ্রি চ্যানেল", "ডানকান প্যাসেজ"], correct: 2 },
            { question: "২২. ভারতের প্রমাণ সময় (IST) গ্রিনিচের প্রমাণ সময়ের (GMT) থেকে কতটা এগিয়ে?", options: ["৪ ঘণ্টা ৩০ মিনিট", "৫ ঘণ্টা", "৫ ঘণ্টা ৩০ মিনিট", "৬ ঘণ্টা"], correct: 2 },
            { question: "২৩. বছরে দুবার বৃষ্টিপাত হয় ভারতের কোন উপকূলে?", options: ["মালাবার উপকূল", "কঙ্কণ উপকূল", "করমণ্ডল উপকূল", "উত্তর সরকার উপকূল"], correct: 2 },
            { question: "২৪. ২০১১ সালের সেন্সাস অনুযায়ী পশ্চিমবঙ্গের কোন জেলার জনঘনত্ব সর্বাধিক?", options: ["উত্তর ২৪ পরগণা", "হাওড়া", "কলকাতা", "হুগলি"], correct: 2 },
            { question: "২৫. আন্দামানে অবস্থিত ভারতের একমাত্র সক্রিয় আগ্নেয়গিরি (Active Volcano) কোনটি?", options: ["নারকোন্ডাম", "ব্যারেন দ্বীপ", "মিনিকয়", "পাম্বান"], correct: 1 }
        ];

        let currentIndex = 0;
        let userScore = 0;
        let timeLeft = 30;
        let activeTimer;

        const qTxtEl = document.getElementById("q-txt");
        const optsAreaEl = document.getElementById("opts-area");
        const timeTxtEl = document.getElementById("time-txt");
        const trackerTxtEl = document.getElementById("tracker-txt");
        const scoreTxtEl = document.getElementById("score-txt");

        function renderQuestion() {
            clearInterval(activeTimer);
            timeLeft = 30;
            timeTxtEl.innerText = timeLeft;

            const currentQ = questionsList[currentIndex];
            qTxtEl.innerText = currentQ.question;
            trackerTxtEl.innerText = `প্রশ্ন: ${currentIndex + 1} / ${questionsList.length}`;

            optsAreaEl.innerHTML = "";
            currentQ.options.forEach((optText, i) => {
                const optDiv = document.createElement("div");
                optDiv.className = "option-item";
                optDiv.innerHTML = `<span>${optText}</span> <span class="icon-holder"></span>`;
                optDiv.onclick = () => validateAnswer(i, optDiv);
                optsAreaEl.appendChild(optDiv);
            });

            activeTimer = setInterval(() => {
                timeLeft--;
                timeTxtEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(activeTimer);
                    revealCorrectOnly();
                }
            }, 1000);
        }

        function validateAnswer(selectedIdx, clickedEl) {
            clearInterval(activeTimer);
            const correctIdx = questionsList[currentIndex].correct;
            const allOptions = optsAreaEl.children;

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add("disabled-opt");
                if (i === correctIdx) {
                    allOptions[i].classList.add("opt-correct");
                    allOptions[i].querySelector(".icon-holder").innerText = "✔";
                }
            }

            if (selectedIdx === correctIdx) {
                userScore++;
                scoreTxtEl.innerText = userScore;
            } else {
                clickedEl.classList.add("opt-wrong");
                clickedEl.querySelector(".icon-holder").innerText = "✖";
            }
        }

        function revealCorrectOnly() {
            const correctIdx = questionsList[currentIndex].correct;
            const allOptions = optsAreaEl.children;
            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add("disabled-opt");
                if (i === correctIdx) {
                    allOptions[i].classList.add("opt-correct");
                    allOptions[i].querySelector(".icon-holder").innerText = "✔";
                }
            }
        }

        function triggerNext() {
            currentIndex++;
            if (currentIndex < questionsList.length) {
                renderQuestion();
            } else {
                document.getElementById("active-quiz-portal").style.display = "none";
                document.getElementById("result-portal").style.display = "block";
                document.getElementById("final-score-display").innerText = `${userScore} / ${questionsList.length}`;
            }
        }

        window.onload = renderQuestion;
    </script>
</body>
</html>
