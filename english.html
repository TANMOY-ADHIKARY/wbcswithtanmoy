<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBCS Premium English Mock Test - WBCS With Tanmoy</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* ===================================================
           DEEP VIBRANT PORTAL (100% FIXED - 25 ENGLISH TOPICS)
        =================================================== */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }

        body { background: #eaf0f6; }

        .quiz-super-container {
            width: 94%;
            max-width: 960px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 4px solid #ced6e0;
            overflow: hidden;
        }

        /* Top Bar - Deep Dark Navy */
        .quiz-header-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #0a183d; 
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d63031;
        }

        .timer-badge {
            background: #ff4757;
            color: white;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .question-tracker {
            background: #1e90ff;
            color: white;
            font-weight: 900;
            padding: 8px 22px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .score-badge {
            background: #009432;
            color: white;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .quiz-body { padding: 35px 40px; }

        .question-display-card {
            background: #0c2461;
            color: #ffffff;
            border: 4px solid #4a69bd;
            padding: 25px 30px;
            border-radius: 16px;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 35px;
            line-height: 1.5;
            box-shadow: 0 8px 20px rgba(12, 36, 97, 0.4);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 20px;
        }

        .option-item {
            background: #ffffff;
            border: 3px solid #70a1ff;
            border-left: 8px solid #1e90ff;
            padding: 18px 22px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 800;
            color: #2f3542;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .opt-correct {
            background: #009432 !important;
            color: white !important;
            border: 3px solid #004015 !important;
            border-left: 8px solid #00260c !important;
            box-shadow: 0 6px 15px rgba(0, 148, 50, 0.4) !important;
        }

        .opt-wrong {
            background: #d63031 !important;
            color: white !important;
            border: 3px solid #801d1d !important;
            border-left: 8px solid #4d1111 !important;
            box-shadow: 0 6px 15px rgba(214, 48, 49, 0.4) !important;
        }

        .disabled-opt { pointer-events: none; }

        .quiz-footer { margin-top: 40px; padding-top: 20px; }

        .next-action-btn {
            width: 100%;
            background: #d63031;
            color: white;
            border: none;
            border-bottom: 5px solid #8c1d1d; 
            padding: 18px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            display: block; 
            box-shadow: 0 8px 20px rgba(214, 48, 49, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .next-action-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* Result Screen */
        .result-container { display: none; text-align: center; padding: 80px 20px; }
        .result-container h2 { font-size: 35px; color: #0c2461; font-weight:900; margin-bottom: 20px; }
        .result-score-txt { font-size: 65px; font-weight: 900; color: #009432; margin-bottom: 35px; }

        @media screen and (max-width: 768px) {
            .quiz-super-container { width: 100%; margin: 0 auto; border-radius: 0; border: none; }
            .quiz-header-bar { padding: 14px 15px; }
            .timer-badge, .question-tracker, .score-badge { padding: 6px 12px; font-size: 15px; }
            
            .quiz-body { padding: 25px 18px; }
            .question-display-card { font-size: 19px; padding: 20px; margin-bottom: 25px; }
            
            .options-grid { grid-template-columns: 1fr; gap: 14px; }
            .option-item { padding: 16px 20px; font-size: 16px; }
            
            .next-action-btn { padding: 16px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <img src="logo.png" alt="Wbcs with Tanmoy" class="top-logo" onerror="this.style.display='none'">
        <h1 class="main-title">WBCS WITH TANMOY</h1>
    </header>

    <div class="site-info-bar">
        <span>📅 Estd: 19.06.2026</span>
        <span class="separator">|</span>
        <span>📍 Alipurduar</span>
    </div>

    <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="index.html">Notes</a>
        <a href="https://drive.google.com/drive/folders/1xMzQB4SyceBRpZ4D2lC6p97Y64Jwjamy?usp=drive_link" target="_blank">Syllabus</a>
        <a href="https://drive.google.com/drive/folders/1nXT_2jDf4UpzG0d_zwPrDGf4nYcMUpVm?usp=sharing" target="_blank">Pyq</a>
        <a href="https://drive.google.com/drive/folders/1oF85zmZwjae4ZLavy61dbq8Eda19Eksd?usp=drive_link" target="_blank">Books</a>
        <a href="mocktest.html" style="color: #e74c3c;">Mock Test</a>
    </nav>

    <div class="quiz-super-container">
        
        <div id="active-quiz-portal">
            <div class="quiz-header-bar">
                <div class="timer-badge">⏱ <span id="time-txt">30</span>s</div>
                <div class="question-tracker" id="tracker-txt">প্রশ্ন: ১ / ২৫</div>
                <div class="score-badge">Score: <span id="score-txt">0</span></div>
            </div>

            <div class="quiz-body">
                <div class="question-display-card" id="q-txt"></div>
                
                <div class="options-grid" id="opts-area"></div>

                <div class="quiz-footer">
                    <button class="next-action-btn" onclick="triggerNext()">পরের প্রশ্ন ➔</button>
                </div>
            </div>
        </div>

        <div class="result-container" id="result-portal">
            <h2>মক টেস্ট সমাপ্ত! 🎉</h2>
            <div class="result-score-txt" id="final-score-display">0 / 0</div>
            <a href="mocktest.html" style="background:#0c2461; color:white; padding:16px 45px; border-radius:30px; text-decoration:none; font-weight:900; font-size:18px; display:inline-block;">মেইন মেনু</a>
        </div>

    </div>

    <script>
        // ২৫টি বাছাই করা "Multi-Topic" WBCS English Standard Questions
        const questionsList = [
            // 1. Synonyms (1-3)
            { question: "1. Choose the correct synonym of 'EMANCIPATE':", options: ["Set free", "Imprison", "Restrain", "Misguide"], correct: 0 },
            { question: "2. Choose the correct synonym of 'PRAGMATIC':", options: ["Theoretical", "Practical", "Idealistic", "Careless"], correct: 1 },
            { question: "3. Choose the correct synonym of 'GULLIBLE':", options: ["Cynical", "Credulous", "Astute", "Suspicious"], correct: 1 },

            // 2. Antonyms (4-6)
            { question: "4. Choose the correct antonym of 'AFFLUENCE':", options: ["Poverty", "Wealth", "Influence", "Neglect"], correct: 0 },
            { question: "5. Choose the correct antonym of 'CONCUR':", options: ["Agree", "Disagree", "Praise", "Accept"], correct: 1 },
            { question: "6. Choose the correct antonym of 'ZENITH':", options: ["Pinnacle", "Acme", "Nadir", "Climax"], correct: 2 },

            // 3. One Word Substitution (7-9)
            { question: "7. A person who hates mankind is called a/an:", options: ["Philanthropist", "Misanthrope", "Misogynist", "Cannibal"], correct: 1 },
            { question: "8. A remedy for all diseases is known as a/an:", options: ["Antibiotic", "Panacea", "Antidote", "Anodyne"], correct: 1 },
            { question: "9. One who walks in one's sleep is called a/an:", options: ["Somnambulist", "Somniloquist", "Egoist", "Altruist"], correct: 0 },

            // 4. Idioms & Phrases (10-12)
            { question: "10. The idiom 'To smell a rat' means:", options: ["To see signs of plague", "To suspect foul play", "To act like a coward", "To smell a bad odor"], correct: 1 },
            { question: "11. The idiom 'To bury the hatchet' means:", options: ["To hide treasure", "To make peace", "To declare war", "To plant a tree"], correct: 1 },
            { question: "12. What does the idiom 'A white elephant' imply?", options: ["A rare creature", "An expensive but useless item", "A symbol of royalty", "A huge triumph"], correct: 1 },

            // 5. Phrasal Verbs (13-15)
            { question: "13. The match was _____ due to heavy rain.", options: ["called in", "called up", "called off", "called out"], correct: 2 },
            { question: "14. You must _____ your bad habits immediately.", options: ["give in", "give up", "give away", "give over"], correct: 1 },
            { question: "15. I _____ an old friend in the market yesterday.", options: ["came across", "came by", "came of", "came round"], correct: 0 },

            // 6. Appropriate Prepositions (16-18)
            { question: "16. He is completely indifferent _____ praise or blame.", options: ["for", "to", "with", "about"], correct: 1 },
            { question: "17. She congratulated him _____ his brilliant success.", options: ["for", "on", "with", "about"], correct: 1 },
            { question: "18. We should never jeer _____ a poor man.", options: ["at", "on", "to", "of"], correct: 0 },

            // 7. Parts of Speech & Grammar (19-21)
            { question: "19. 'He works HARD.' — Here the word 'hard' is a/an:", options: ["Adjective", "Adverb", "Noun", "Preposition"], correct: 1 },
            { question: "20. Choose the correct Noun form of the verb 'Accept':", options: ["Acceptable", "Acceptance", "Accepting", "Accepted"], correct: 1 },
            { question: "21. Hardly had he reached the station _____ the train left.", options: ["than", "when", "then", "since"], correct: 1 },

            // 8. Voice & Narration Change (22-23)
            { question: "22. Change the Voice: 'Who painted this beautiful picture?'", options: ["By whom this picture was painted?", "By whom was this picture painted?", "Who was painted this picture?", "By whom is this picture painted?"], correct: 1 },
            { question: "23. Change the Narration: He said to me, 'May you live long!'", options: ["He prayed that I might live long.", "He wished that I may live long.", "He asked me if I lived long.", "He blessed me to live long."], correct: 0 },

            // 9. Spelling & Spotting the Error (24-25)
            { question: "24. Choose the correctly spelt word:", options: ["Assassinaton", "Assassination", "Asassination", "Assasination"], correct: 1 },
            { question: "25. Spot the Error: 'Neither of the two boys (A) / have done (B) / their task. (C) / No Error (D)'", options: ["Part A", "Part B", "Part C", "Part D"], correct: 1 }
        ];

        let currentIndex = 0;
        let userScore = 0;
        let timeLeft = 30;
        let activeTimer;

        const qTxtEl = document.getElementById("q-txt");
        const optsAreaEl = document.getElementById("opts-area");
        const timeTxtEl = document.getElementById("time-txt");
        const trackerTxtEl = document.getElementById("tracker-txt");
        const scoreTxtEl = document.getElementById("score-txt");

        function renderQuestion() {
            clearInterval(activeTimer);
            timeLeft = 30;
            timeTxtEl.innerText = timeLeft;

            const currentQ = questionsList[currentIndex];
            qTxtEl.innerText = currentQ.question;
            trackerTxtEl.innerText = `প্রশ্ন: ${currentIndex + 1} / ${questionsList.length}`;

            optsAreaEl.innerHTML = "";
            currentQ.options.forEach((optText, i) => {
                const optDiv = document.createElement("div");
                optDiv.className = "option-item";
                optDiv.innerHTML = `<span>${optText}</span> <span class="icon-holder"></span>`;
                optDiv.onclick = () => validateAnswer(i, optDiv);
                optsAreaEl.appendChild(optDiv);
            });

            activeTimer = setInterval(() => {
                timeLeft--;
                timeTxtEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(activeTimer);
                    revealCorrectOnly();
                }
            }, 1000);
        }

        function validateAnswer(selectedIdx, clickedEl) {
            clearInterval(activeTimer);
            const correctIdx = questionsList[currentIndex].correct;
            const allOptions = optsAreaEl.children;

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add("disabled-opt");
                if (i === correctIdx) {
                    allOptions[i].classList.add("opt-correct");
                    allOptions[i].querySelector(".icon-holder").innerText = "✔";
                }
            }

            if (selectedIdx === correctIdx) {
                userScore++;
                scoreTxtEl.innerText = userScore;
            } else {
                clickedEl.classList.add("opt-wrong");
                clickedEl.querySelector(".icon-holder").innerText = "✖";
            }
        }

        function revealCorrectOnly() {
            const correctIdx = questionsList[currentIndex].correct;
            const allOptions = optsAreaEl.children;
            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add("disabled-opt");
                if (i === correctIdx) {
                    allOptions[i].classList.add("opt-correct");
                    allOptions[i].querySelector(".icon-holder").innerText = "✔";
                }
            }
        }

        function triggerNext() {
            currentIndex++;
            if (currentIndex < questionsList.length) {
                renderQuestion();
            } else {
                document.getElementById("active-quiz-portal").style.display = "none";
                document.getElementById("result-portal").style.display = "block";
                document.getElementById("final-score-display").innerText = `${userScore} / ${questionsList.length}`;
            }
        }

        window.onload = renderQuestion;
    </script>
</body>
</html>
