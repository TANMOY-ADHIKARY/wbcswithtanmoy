<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Polity Mock Test - PRO Premium</title>
    <style>
        /* =========================================
           Ultra Premium Colorful Design
        ========================================= */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); 
            color: #333; 
            margin: 0; 
            padding: 30px 15px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container { 
            width: 100%;
            max-width: 800px; 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 25px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            position: relative; 
            border-top: 10px solid #6c5ce7;
        }

        /* Header & Timer */
        .header-section { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #f1f2f6; 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
        }

        .back-btn { 
            text-decoration: none; 
            color: #fff; 
            font-weight: bold; 
            font-size: 16px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
            transition: all 0.3s;
        }
        .back-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4); }
        
        /* 30 Sec Timer Badge */
        #timer-container { 
            font-size: 18px; 
            font-weight: 900; 
            color: #fff; 
            background: linear-gradient(45deg, #ff416c, #ff4b2b); 
            padding: 10px 25px; 
            border-radius: 30px; 
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); box-shadow: 0 0 20px rgba(255, 65, 108, 0.8); }
            100% { transform: scale(1); }
        }
        .time-warning { animation: pulse 1s infinite; }

        .mock-title {
            text-align: center; 
            color: #2d3436; 
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Beautiful Question Counter */
        .counter-wrapper { text-align: center; margin-bottom: 35px; }
        #question-counter { 
            font-size: 18px; 
            font-weight: bold; 
            color: #fff; 
            background: linear-gradient(135deg, #0984e3 0%, #00cec9 100%);
            padding: 8px 25px; 
            border-radius: 25px; 
            display: inline-block;
            box-shadow: 0 4px 15px rgba(9, 132, 227, 0.3);
            letter-spacing: 1px;
        }

        /* Question & Options */
        .question-block { 
            display: none; 
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question { 
            font-size: 24px; 
            font-weight: 800; 
            margin-bottom: 25px; 
            color: #2c3e50; 
            line-height: 1.5;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border-left: 6px solid #fdcb6e;
        }

        /* Options Styling */
        .options label { 
            display: flex; 
            align-items: center;
            background: #ffffff; 
            padding: 18px 20px; 
            margin-bottom: 15px; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            border: 2px solid #dfe6e9; 
            font-size: 18px; 
            color: #2d3436;
            font-weight: 600;
        }

        .options label:hover { 
            background: #f1f2f6; 
            border-color: #74b9ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .options input[type="radio"] { 
            margin-right: 15px; 
            transform: scale(1.5); 
            accent-color: #0984e3;
            cursor: pointer;
        }

        /* Active Selected Option */
        .options label:has(input[type="radio"]:checked) {
            background: #e3f2fd;
            border-color: #0984e3;
            color: #0984e3;
            box-shadow: 0 4px 10px rgba(9, 132, 227, 0.2);
        }

        /* =========================================
           Correct & Wrong Premium Colors
        ========================================= */
        /* Answer thik hole (সবুজ) */
        .correct-ans { 
            background: linear-gradient(135deg, #0ba360 0%, #3cba92 100%) !important; 
            color: #ffffff !important; 
            border: none !important; 
            box-shadow: 0 8px 20px rgba(11, 163, 96, 0.4) !important;
            transform: scale(1.02);
        }

        /* Answer vul hole (লাল) */
        .wrong-ans { 
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%) !important; 
            color: #ffffff !important; 
            border: none !important; 
            box-shadow: 0 8px 20px rgba(255, 8, 68, 0.4) !important;
            text-decoration: line-through;
            opacity: 0.9;
        }
        
        /* Navigation Buttons */
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 40px; }
        .nav-btn { 
            padding: 14px 35px; 
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%); 
            color: white; 
            border: none; 
            border-radius: 30px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            box-shadow: 0 6px 15px rgba(45, 52, 54, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(45, 52, 54, 0.5); }
        .nav-btn:disabled { background: #b2bec3; box-shadow: none; cursor: not-allowed; transform: none; }
        
        .submit-btn { background: linear-gradient(135deg, #00b09b, #96c93d); display: none; box-shadow: 0 6px 15px rgba(0, 176, 155, 0.4); }
        .submit-btn:hover { box-shadow: 0 8px 20px rgba(0, 176, 155, 0.6); }
        
        /* Result Box */
        #result { 
            margin-bottom: 30px; 
            font-size: 26px; 
            font-weight: 900; 
            text-align: center; 
            padding: 25px; 
            border-radius: 15px; 
            display: none; 
            animation: fadeIn 0.5s;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="header-section">
            <a href="mocktest.html" class="back-btn">← মেইন মেনু</a>
            <div id="timer-container">⏱ <span id="time-left">30 সেকেন্ড</span></div>
        </div>
        
        <h2 class="mock-title">Indian Polity Mock Test</h2>
        
        <div class="counter-wrapper">
            <div id="question-counter">প্রশ্ন: ১ / ৩</div>
        </div>
        
        <div id="result"></div>
        
        <div id="quiz-form">
            <div class="question-block">
                <div class="question">১. গণপরিষদের প্রথম অস্থায়ী সভাপতি কে ছিলেন?</div>
                <div class="options">
                    <label><input type="radio" name="q1" value="a"> ডঃ সচ্চিদানন্দ সিনহা</label>
                    <label><input type="radio" name="q1" value="b"> ডঃ রাজেন্দ্র প্রসাদ</label>
                    <label><input type="radio" name="q1" value="c"> ডঃ বি. আর. আম্বেদকর</label>
                    <label><input type="radio" name="q1" value="d"> জওহরলাল নেহেরু</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question">২. ভারতের সংবিধান কবে গৃহীত হয়?</div>
                <div class="options">
                    <label><input type="radio" name="q2" value="a"> ২৬ শে জানুয়ারি, ১৯৫০</label>
                    <label><input type="radio" name="q2" value="b"> ২৬ শে নভেম্বর, ১৯৪৯</label>
                    <label><input type="radio" name="q2" value="c"> ১৫ ই আগস্ট, ১৯৪৭</label>
                    <label><input type="radio" name="q2" value="d"> ২৪ শে জানুয়ারি, ১৯৫০</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question">৩. ভারতীয় সংবিধানের খসড়া কমিটির চেয়ারম্যান কে ছিলেন?</div>
                <div class="options">
                    <label><input type="radio" name="q3" value="a"> মহাত্মা গান্ধী</label>
                    <label><input type="radio" name="q3" value="b"> সর্দার বল্লভভাই প্যাটেল</label>
                    <label><input type="radio" name="q3" value="c"> ডঃ বি. আর. আম্বেদকর</label>
                    <label><input type="radio" name="q3" value="d"> ডঃ রাজেন্দ্র প্রসাদ</label>
                </div>
            </div>

            <div class="nav-buttons" id="nav-container">
                <button type="button" class="nav-btn" id="prev-btn" onclick="prevQuestion()">Previous</button>
                <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">Next</button>
                <button type="button" class="nav-btn submit-btn" id="submit-btn" onclick="calculateScore()">Submit Test</button>
            </div>
        </div>
    </div>

    <script>
        let currentQuestion = 0;
        let questions;
        let timerInterval;
        const TIME_PER_QUESTION = 30; // 30 seconds timer
        let timeLeft = TIME_PER_QUESTION;

        window.onload = function() {
            questions = document.querySelectorAll('.question-block');
            showQuestion(currentQuestion);
        };

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = TIME_PER_QUESTION;
            updateTimerUI();
            
            timerInterval = setInterval(function() {
                timeLeft--;
                updateTimerUI();
                
                let timerBox = document.getElementById('timer-container');
                if(timeLeft <= 5) {
                    timerBox.classList.add("time-warning");
                } else {
                    timerBox.classList.remove("time-warning");
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerBox.classList.remove("time-warning");
                    if (currentQuestion < questions.length - 1) {
                        nextQuestion();
                    } else {
                        calculateScore(); 
                    }
                }
            }, 1000);
        }

        function updateTimerUI() {
            document.getElementById('time-left').innerText = timeLeft + " সেকেন্ড";
        }

        function showQuestion(index) {
            questions.forEach((q, i) => { q.style.display = (i === index) ? "block" : "none"; });
            document.getElementById('question-counter').innerText = "প্রশ্ন: " + (index + 1) + " / " + questions.length;
            
            document.getElementById('prev-btn').style.display = (index === 0) ? "none" : "inline-block";
            
            if (index === questions.length - 1) {
                document.getElementById('next-btn').style.display = "none";
                document.getElementById('submit-btn').style.display = "inline-block";
            } else {
                document.getElementById('next-btn').style.display = "inline-block";
                document.getElementById('submit-btn').style.display = "none";
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            startTimer(); 
        }

        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; showQuestion(currentQuestion); } }
        function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; showQuestion(currentQuestion); } }

        function calculateScore() {
            clearInterval(timerInterval);
            document.getElementById('timer-container').style.display = 'none';
            document.getElementById('nav-container').style.display = 'none';
            document.getElementById('question-counter').style.display = 'none';

            let score = 0;
            // Answer Key
            const correctAnswers = { q1:"a", q2:"b", q3:"c" };

            questions.forEach((qBlock, index) => {
                qBlock.style.display = "block"; 
                let qName = "q" + (index + 1);
                let selectedInput = document.querySelector(`input[name="${qName}"]:checked`);
                let correctInput = document.querySelector(`input[name="${qName}"][value="${correctAnswers[qName]}"]`);
                let allInputs = document.querySelectorAll(`input[name="${qName}"]`);

                // সঠিক উত্তরে সবুজ হাইলাইট এবং আইকন
                if (correctInput) { 
                    correctInput.parentElement.classList.add("correct-ans"); 
                    correctInput.parentElement.innerHTML += " ✅";
                }

                // ভুল উত্তর দিলে লাল হাইলাইট এবং আইকন
                if (selectedInput) {
                    if (selectedInput.value !== correctAnswers[qName]) {
                        selectedInput.parentElement.classList.add("wrong-ans"); 
                        selectedInput.parentElement.innerHTML += " ❌";
                    } else { 
                        score++; 
                    }
                }

                allInputs.forEach(input => input.disabled = true);
            });

            let resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `আপনার স্কোর: ${score} / ${questions.length}`;
            
            if(score >= (questions.length * 0.8)) {
                resultDiv.style.background = "linear-gradient(135deg, #11998e 0%, #38ef7d 100%)"; resultDiv.style.color = "#fff";
                resultDiv.innerHTML += "<br>অসাধারণ পারফরম্যান্স! 🌟";
            } else {
                resultDiv.style.background = "linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%)"; resultDiv.style.color = "#fff";
                resultDiv.innerHTML += "<br>সঠিক উত্তরগুলো মিলিয়ে নিন! 📖";
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
