<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Polity Mock Test - WBCS With Tanmoy</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* ===================================================
           MASTER ASSESSMENT PORTAL (DESKTOP + MOBILE)
        =================================================== */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body { background: #f4f6f9; margin: 0; padding: 0; }

        /* ল্যাপটপ ও ডেস্কটপের জন্য মূল কন্টেইনার (বড় ও রাজকীয়) */
        .quiz-super-container {
            width: 94%;
            max-width: 980px; /* ল্যাপটপে একদম পারফেক্ট চওড়া লুক দেবে */
            margin: 40px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e1e8ed;
            overflow: hidden;
        }

        /* Top Bar (Sticky) */
        .quiz-header-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #ffffff;
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #edf2f7;
        }

        .timer-badge {
            background: #fffaf0;
            border: 2px solid #dd6b20;
            color: #dd6b20;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
        }

        .question-tracker {
            background: #ebf8ff;
            border: 2px solid #3182ce;
            color: #3182ce;
            font-weight: 900;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 16px;
        }

        .score-badge {
            background: #f0fff4;
            border: 2px solid #38a169;
            color: #38a169;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
        }

        /* Main Question Area */
        .quiz-body { padding: 35px 40px; }

        .question-display-card {
            background: #f7fafc;
            border-left: 6px solid #3182ce;
            padding: 25px 30px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 800;
            color: #2d3748;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* অপশন গ্রিড: ল্যাপটপে ২x২, মোবাইলে ১x৪ */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* ল্যাপটপে পাশাপাশি ২টো করে অপশন */
            gap: 20px;
        }

        .option-item {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 18px 22px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-item:hover {
            background: #ebf8ff;
            border-color: #63b3ed;
            color: #2b6cb0;
            transform: translateY(-2px);
        }

        .option-item:active { transform: translateY(0); }

        /* Colors for Right/Wrong */
        .opt-correct {
            background: #38a169 !important;
            color: white !important;
            border-color: #276749 !important;
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.3);
        }

        .opt-wrong {
            background: #e53e3e !important;
            color: white !important;
            border-color: #9b2c2c !important;
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.3);
        }

        .disabled-opt { pointer-events: none; }

        /* Action Footer (স্থায়ী উচ্চতা = লাফালাফি ১০০% বন্ধ) */
        .quiz-footer {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px solid #edf2f7;
            display: flex;
            justify-content: flex-end;
            min-height: 85px; /* এই হাইট ফিক্সড, তাই বাটন এলে পেজ নড়বে না */
        }

        .next-action-btn {
            background: #3182ce;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            visibility: hidden; /* ম্যাজিক: বাটন অদৃশ্য থাকবে, কিন্তু তার নিজের জায়গা ধরে রাখবে */
            box-shadow: 0 4px 15px rgba(49, 130, 206, 0.4);
            transition: all 0.2s;
        }

        .next-action-btn:hover { background: #2b6cb0; }

        /* Result Screen */
        .result-container {
            display: none;
            text-align: center;
            padding: 80px 20px;
        }
        .result-container h2 { font-size: 32px; color: #2d3748; margin-bottom: 20px; }
        .result-score-txt { font-size: 55px; font-weight: 900; color: #38a169; margin-bottom: 35px; }

        /* ===================================================
           MOBILE VIEW ADJUSTMENTS (< 768px)
        =================================================== */
        @media screen and (max-width: 768px) {
            .quiz-super-container { width: 100%; margin: 10px auto; border-radius: 0; border: none; }
            .quiz-body { padding: 20px 15px; }
            .question-display-card { font-size: 18px; padding: 18px 20px; margin-bottom: 25px; }
            
            /* মোবাইলে গ্রিড ভেঙে নিচে নিচে ১ লাইনে চলে আসবে */
            .options-grid { grid-template-columns: 1fr; gap: 12px; }
            .option-item { padding: 15px 18px; font-size: 15px; }
            
            .quiz-footer { justify-content: center; min-height: 75px; }
            .next-action-btn { width: 100%; padding: 15px; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <img src="logo.png" alt="Wbcs with Tanmoy" class="top-logo" onerror="this.style.display='none'">
        <h1 class="main-title">WBCS WITH TANMOY</h1>
    </header>

    <div class="site-info-bar">
        <span>📅 Estd: 19.06.2026</span>
        <span class="separator">|</span>
        <span>📍 Alipurduar</span>
    </div>

    <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="index.html">Notes</a>
        <a href="https://drive.google.com/drive/folders/1xMzQB4SyceBRpZ4D2lC6p97Y64Jwjamy?usp=drive_link" target="_blank">Syllabus</a>
        <a href="https://drive.google.com/drive/folders/1nXT_2jDf4UpzG0d_zwPrDGf4nYcMUpVm?usp=sharing" target="_blank">Pyq</a>
        <a href="https://drive.google.com/drive/folders/1oF85zmZwjae4ZLavy61dbq8Eda19Eksd?usp=drive_link" target="_blank">Books</a>
        <a href="mocktest.html" style="color: #e74c3c;">Mock Test</a>
    </nav>

    <div class="quiz-super-container">
        
        <div id="active-quiz-portal">
            <div class="quiz-header-bar">
                <div class="timer-badge">⏱ <span id="time-txt">30</span>s</div>
                <div class="question-tracker" id="tracker-txt">প্রশ্ন: ১ / ৩</div>
                <div class="score-badge">Score: <span id="score-txt">0</span></div>
            </div>

            <div class="quiz-body">
                <div class="question-display-card" id="q-txt"></div>
                
                <div class="options-grid" id="opts-area"></div>

                <div class="quiz-footer">
                    <button class="next-action-btn" id="nxt-btn" onclick="triggerNext()">পরের প্রশ্ন ➔</button>
                </div>
            </div>
        </div>

        <div class="result-container" id="result-portal">
            <h2>মক টেস্ট সমাপ্ত! 🎉</h2>
            <div class="result-score-txt" id="final-score-display">0 / 0</div>
            <a href="mocktest.html" style="background:#3182ce; color:white; padding:14px 35px; border-radius:30px; text-decoration:none; font-weight:bold; display:inline-block;">মেইন মেনু</a>
        </div>

    </div>

    <script>
        // তোমার সব প্রশ্ন এইখানে থাকবে
        const questionsList = [
            {
                question: "১. গণপরিষদের প্রথম অস্থায়ী সভাপতি কে ছিলেন?",
                options: ["ডঃ সচ্চিদানন্দ সিনহা", "ডঃ রাজেন্দ্র প্রসাদ", "ডঃ বি. আর. আম্বেদকর", "জওহরলাল নেহেরু"],
                correct: 0
            },
            {
                question: "২. ভারতের সংবিধান কবে গৃহীত হয়?",
                options: ["২৬ শে জানুয়ারি, ১৯৫০", "২৬ শে নভেম্বর, ১৯৪৯", "১৫ ই আগস্ট, ১৯৪৭", "২৪ শে জানুয়ারি, ১৯৫০"],
                correct: 1
            },
            {
                question: "৩. ভারতীয় সংবিধানের খসড়া কমিটির চেয়ারম্যান কে ছিলেন?",
                options: ["মহাত্মা গান্ধী", "সর্দার বল্লভভাই প্যাটেল", "ডঃ বি. আর. আম্বেদকর", "ডঃ রাজেন্দ্র প্রসাদ"],
                correct: 2
            }
        ];

        let currentIndex = 0;
        let userScore = 0;
        let timeLeft = 30;
        let activeTimer;

        const qTxtEl = document.getElementById("q-txt");
        const optsAreaEl = document.getElementById("opts-area");
        const nxtBtnEl = document.getElementById("nxt-btn");
        const timeTxtEl = document.getElementById("time-txt");
        const trackerTxtEl = document.getElementById("tracker-txt");
        const scoreTxtEl = document.getElementById("score-txt");

        function renderQuestion() {
            clearInterval(activeTimer);
            timeLeft = 30;
            timeTxtEl.innerText = timeLeft;
            nxtBtnEl.style.visibility = "hidden"; // অদৃশ্য থাকবে, কিন্তু জায়গা ছাড়বে না

            const currentQ = questionsList[currentIndex];
            qTxtEl.innerText = currentQ.question;
            trackerTxtEl.innerText = `প্রশ্ন: ${currentIndex + 1} / ${questionsList.length}`;

            optsAreaEl.innerHTML = "";
            currentQ.options.forEach((optText, i) => {
                const optDiv = document.createElement("div");
                optDiv.className = "option-item";
                optDiv.innerHTML = `<span>${optText}</span> <span class="icon-holder"></span>`;
                optDiv.onclick = () => validateAnswer(i, optDiv);
                optsAreaEl.appendChild(optDiv);
            });

            activeTimer = setInterval(() => {
                timeLeft--;
                timeTxtEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(activeTimer);
                    revealCorrectOnly();
                }
            }, 1000);
        }

        function validateAnswer(selectedIdx, clickedEl) {
            clearInterval(activeTimer);
            const correctIdx = questionsList[currentIndex].correct;
            const allOptions = optsAreaEl.children;

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add("disabled-opt");
                if (i === correctIdx) {
                    allOptions[i].classList.add("opt-correct");
                    allOptions[i].querySelector(".icon-holder").innerText = "✔";
                }
            }

            if (selectedIdx === correctIdx) {
                userScore++;
                scoreTxtEl.innerText = userScore;
            } else {
                clickedEl.classList.add("opt-wrong");
                clickedEl.querySelector(".icon-holder").innerText = "✖";
            }

            nxtBtnEl.style.visibility = "visible"; // বাটন দৃশ্যমান হবে, পেজ এক চুলও নড়বে না
        }

        function revealCorrectOnly() {
            const correctIdx = questionsList[currentIndex].correct;
            const allOptions = optsAreaEl.children;
            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add("disabled-opt");
                if (i === correctIdx) {
                    allOptions[i].classList.add("opt-correct");
                    allOptions[i].querySelector(".icon-holder").innerText = "✔";
                }
            }
            nxtBtnEl.style.visibility = "visible";
        }

        function triggerNext() {
            currentIndex++;
            if (currentIndex < questionsList.length) {
                renderQuestion();
            } else {
                document.getElementById("active-quiz-portal").style.display = "none";
                document.getElementById("result-portal").style.display = "block";
                document.getElementById("final-score-display").innerText = `${userScore} / ${questionsList.length}`;
            }
        }

        window.onload = renderQuestion;
    </script>
</body>
</html>
