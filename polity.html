<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian Polity Mock Test - App View</title>
    <style>
        /* =========================================
           Compact App-Like Design (No Scrolling)
        ========================================= */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }

        body { 
            background: #e8ebf2; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; /* পুরো স্ক্রিন জুড়বে, স্ক্রল হবে না */
            overflow: hidden; 
        }

        .app-container { 
            width: 100%; 
            max-width: 450px; 
            background: #ffffff; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Top Bar (Timer, Counter, Score) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e1e8ed;
        }

        .timer { font-weight: bold; color: #d35400; font-size: 16px; }
        .score-board { font-weight: bold; color: #27ae60; font-size: 16px; }
        
        .q-counter {
            background: #ffffff;
            border: 2px solid #e74c3c;
            color: #e74c3c;
            font-weight: 900;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* Quiz Content Area */
        .quiz-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* Question Box */
        .question-box {
            background: #fdfbfb;
            border: 2px solid #3498db;
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.1);
        }

        /* Options */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            background: #e1f5fe;
            border: 2px solid transparent;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #0277bd;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .option-btn:active { transform: scale(0.98); }

        /* Correct / Wrong Colors */
        .correct { background: #2ecc71 !important; color: #fff !important; border-color: #27ae60 !important; }
        .wrong { background: #e74c3c !important; color: #fff !important; border-color: #c0392b !important; }
        .disabled { pointer-events: none; opacity: 0.9; }

        /* Next Button Area */
        .bottom-area {
            padding: 15px 20px 25px 20px;
        }

        .next-btn {
            width: 100%;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            visibility: hidden; /* প্রথমে লুকানো থাকবে */
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .result-screen h2 { color: #2c3e50; margin-bottom: 20px; font-size: 28px; }
        .result-screen .final-score { font-size: 40px; color: #27ae60; font-weight: 900; margin-bottom: 30px; }
        .home-btn {
            text-decoration: none;
            background: #3498db;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="result-screen" id="result-screen">
            <h2>টেস্ট শেষ হয়েছে! 🎉</h2>
            <div class="final-score" id="final-score-text">0 / 0</div>
            <a href="mocktest.html" class="home-btn">মেইন মেনুতে ফিরুন</a>
        </div>

        <div id="quiz-screen" style="display: flex; flex-direction: column; height: 100%;">
            <div class="top-bar">
                <div class="timer">⏱ <span id="timer-txt">30</span>s</div>
                <div class="q-counter" id="q-counter-txt">১ / ৩</div>
                <div class="score-board">Score: <span id="score-txt">0</span></div>
            </div>

            <div class="quiz-content">
                <div class="question-box" id="question-text">
                    </div>
                
                <div class="options-container" id="options-container">
                    </div>
            </div>

            <div class="bottom-area">
                <button class="next-btn" id="next-btn" onclick="goNext()">Next Question ➔</button>
            </div>
        </div>
    </div>

    <script>
        // JS Array: এখানেই সব প্রশ্ন আর অপশন থাকবে। HTML-এ আর হাত দিতে হবে না!
        const quizData = [
            {
                question: "১. গণপরিষদের প্রথম অস্থায়ী সভাপতি কে ছিলেন?",
                options: ["ডঃ সচ্চিদানন্দ সিনহা", "ডঃ রাজেন্দ্র প্রসাদ", "ডঃ বি. আর. আম্বেদকর", "জওহরলাল নেহেরু"],
                answer: 0 // 0 মানে প্রথম অপশনটা সঠিক
            },
            {
                question: "২. ভারতের সংবিধান কবে গৃহীত হয়?",
                options: ["২৬ শে জানুয়ারি, ১৯৫০", "২৬ শে নভেম্বর, ১৯৪৯", "১৫ ই আগস্ট, ১৯৪৭", "২৪ শে জানুয়ারি, ১৯৫০"],
                answer: 1 // 1 মানে দ্বিতীয় অপশনটা সঠিক
            },
            {
                question: "৩. ভারতীয় সংবিধানের খসড়া কমিটির চেয়ারম্যান কে ছিলেন?",
                options: ["মহাত্মা গান্ধী", "সর্দার বল্লভভাই প্যাটেল", "ডঃ বি. আর. আম্বেদকর", "ডঃ রাজেন্দ্র প্রসাদ"],
                answer: 2 // 2 মানে তৃতীয় অপশনটা সঠিক
            }
        ];

        let currentQIndex = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval;

        const questionEl = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const nextBtn = document.getElementById("next-btn");
        const timerTxt = document.getElementById("timer-txt");
        const qCounterTxt = document.getElementById("q-counter-txt");
        const scoreTxt = document.getElementById("score-txt");

        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 30;
            timerTxt.innerText = timeLeft;
            nextBtn.style.visibility = "hidden"; // অপশন ক্লিক করার আগে Next বাটন লুকানো থাকবে

            let currentQ = quizData[currentQIndex];
            
            // প্রশ্ন এবং কাউন্টার সেট করা
            questionEl.innerText = currentQ.question;
            // বাংলা সংখ্যা দেখানোর জন্য ছোট্ট ট্রিক
            qCounterTxt.innerText = `${currentQIndex + 1} / ${quizData.length}`;

            // অপশনগুলো জেনারেট করা
            optionsContainer.innerHTML = "";
            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                timerTxt.innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoShowAnswer(); // সময় শেষ হলে সঠিক উত্তর দেখিয়ে দেবে
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex, btnElement) {
            clearInterval(timerInterval); // ক্লিক করলেই টাইমার থেমে যাবে
            let correctIndex = quizData[currentQIndex].answer;
            let allBtns = optionsContainer.children;

            // অপশনগুলো লক করা
            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].classList.add("disabled");
                if (i === correctIndex) {
                    allBtns[i].classList.add("correct"); // সঠিক উত্তরকে সবুজ করা
                }
            }

            // যদি ক্লিক করা অপশনটা ভুল হয়, তবে সেটাকে লাল করা
            if (selectedIndex === correctIndex) {
                score++;
                scoreTxt.innerText = score;
            } else {
                btnElement.classList.add("wrong");
            }

            nextBtn.style.visibility = "visible"; // Next বাটন দেখানো
        }

        function autoShowAnswer() {
            let correctIndex = quizData[currentQIndex].answer;
            let allBtns = optionsContainer.children;

            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].classList.add("disabled");
                if (i === correctIndex) {
                    allBtns[i].classList.add("correct"); // সময় শেষ হলে শুধু সঠিকটা সবুজ হবে
                }
            }
            nextBtn.style.visibility = "visible";
        }

        function goNext() {
            currentQIndex++;
            if (currentQIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quiz-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "block";
            document.getElementById("final-score-text").innerText = `${score} / ${quizData.length}`;
        }

        // প্রথম প্রশ্ন লোড করা
        window.onload = loadQuestion;
    </script>
</body>
</html>
