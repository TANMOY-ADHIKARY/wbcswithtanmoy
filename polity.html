<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian Polity Mock Test - App View</title>
    <style>
        /* =========================================
           Perfect Mobile App Layout (Deep Colors)
        ========================================= */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }

        body, html { 
            background: #e8ebf2; 
            height: 100%; /* মোবাইলে ফিট করার জন্য */
            overflow: hidden; /* বডিতে কোনো স্ক্রল হবে না */
        }

        .app-container { 
            width: 100%; 
            max-width: 480px; 
            background: #ffffff; 
            height: 100%; /* Fallback */
            height: 100dvh; /* Modern Mobile Viewport Fix */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        /* Top Bar (Timer, Counter, Score) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #dcdde1;
            flex-shrink: 0; /* এটা ছোট হবে না */
        }

        .timer { font-weight: bold; color: #d35400; font-size: 16px; }
        .score-board { font-weight: bold; color: #009432; font-size: 16px; }
        
        .q-counter {
            background: #ffffff;
            border: 2px solid #d63031;
            color: #d63031;
            font-weight: 900;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* Quiz Content Area (শুধুমাত্র এই অংশটা স্ক্রল হবে যদি স্ক্রিন ছোট হয়) */
        .quiz-content {
            padding: 25px 20px;
            flex-grow: 1; /* বাকি পুরো জায়গাটা নেবে */
            overflow-y: auto; /* কন্টেন্ট বড় হলে স্ক্রল হবে, কিন্তু বাটন কাটবে না */
        }

        /* Question Box */
        .question-box {
            background: #ffffff;
            border: 2px solid #0984e3;
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            color: #2d3436;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(9, 132, 227, 0.15);
        }

        /* Options */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            width: 100%;
            background: #f1f2f6; /* অপশন ক্লিক করার আগের রং */
            border: 2px solid #ced6e0;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #2f3542;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .option-btn:active { transform: scale(0.98); }

        /* গাঢ় (Deep) Correct / Wrong Colors */
        .correct { 
            background: #009432 !important; /* কড়া সবুজ */
            color: #ffffff !important; 
            border-color: #009432 !important; 
            box-shadow: 0 4px 10px rgba(0, 148, 50, 0.3);
        }
        
        .wrong { 
            background: #d63031 !important; /* কড়া লাল */
            color: #ffffff !important; 
            border-color: #d63031 !important; 
            box-shadow: 0 4px 10px rgba(214, 48, 49, 0.3);
        }
        
        .disabled { pointer-events: none; opacity: 1; }

        /* Next Button Area (সবসময় নিচে ফিক্সড থাকবে) */
        .bottom-area {
            padding: 15px 20px 30px 20px; /* মোবাইলের নিচের বারের জন্য এক্সট্রা প্যাডিং */
            background: #ffffff;
            border-top: 1px solid #f1f2f6;
            flex-shrink: 0;
        }

        .next-btn {
            width: 100%;
            background: #c0392b; /* কড়া লাল রংয়ের বাটন */
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            visibility: hidden; /* প্রথমে লুকানো থাকবে */
            box-shadow: 0 4px 15px rgba(192, 57, 43, 0.4);
            text-transform: uppercase;
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
            padding: 50px 20px;
            height: 100%;
        }
        .result-screen h2 { color: #2d3436; margin-bottom: 20px; font-size: 28px; font-weight: 900; }
        .result-screen .final-score { font-size: 45px; color: #009432; font-weight: 900; margin-bottom: 40px; }
        .home-btn {
            text-decoration: none;
            background: #0984e3;
            color: white;
            padding: 15px 35px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(9, 132, 227, 0.3);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="result-screen" id="result-screen">
            <h2>টেস্ট শেষ হয়েছে! 🎉</h2>
            <div class="final-score" id="final-score-text">0 / 0</div>
            <a href="mocktest.html" class="home-btn">মেইন মেনুতে ফিরুন</a>
        </div>

        <div id="quiz-screen" style="display: flex; flex-direction: column; height: 100%;">
            
            <div class="top-bar">
                <div class="timer">⏱ <span id="timer-txt">30</span>s</div>
                <div class="q-counter" id="q-counter-txt">১ / ৩</div>
                <div class="score-board">Score: <span id="score-txt">0</span></div>
            </div>

            <div class="quiz-content">
                <div class="question-box" id="question-text">
                    </div>
                
                <div class="options-container" id="options-container">
                    </div>
            </div>

            <div class="bottom-area">
                <button class="next-btn" id="next-btn" onclick="goNext()">Next Question ➔</button>
            </div>
            
        </div>
    </div>

    <script>
        // JS Array: প্রশ্ন ও অপশন
        const quizData = [
            {
                question: "১. গণপরিষদের প্রথম অস্থায়ী সভাপতি কে ছিলেন?",
                options: ["ডঃ সচ্চিদানন্দ সিনহা", "ডঃ রাজেন্দ্র প্রসাদ", "ডঃ বি. আর. আম্বেদকর", "জওহরলাল নেহেরু"],
                answer: 0 
            },
            {
                question: "২. ভারতের সংবিধান কবে গৃহীত হয়?",
                options: ["২৬ শে জানুয়ারি, ১৯৫০", "২৬ শে নভেম্বর, ১৯৪৯", "১৫ ই আগস্ট, ১৯৪৭", "২৪ শে জানুয়ারি, ১৯৫০"],
                answer: 1 
            },
            {
                question: "৩. ভারতীয় সংবিধানের খসড়া কমিটির চেয়ারম্যান কে ছিলেন?",
                options: ["মহাত্মা গান্ধী", "সর্দার বল্লভভাই প্যাটেল", "ডঃ বি. আর. আম্বেদকর", "ডঃ রাজেন্দ্র প্রসাদ"],
                answer: 2 
            }
        ];

        let currentQIndex = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval;

        const questionEl = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const nextBtn = document.getElementById("next-btn");
        const timerTxt = document.getElementById("timer-txt");
        const qCounterTxt = document.getElementById("q-counter-txt");
        const scoreTxt = document.getElementById("score-txt");

        function loadQuestion() {
            // Reset everything for new question
            clearInterval(timerInterval);
            timeLeft = 30;
            timerTxt.innerText = timeLeft;
            nextBtn.style.visibility = "hidden"; 

            let currentQ = quizData[currentQIndex];
            
            questionEl.innerText = currentQ.question;
            qCounterTxt.innerText = `${currentQIndex + 1} / ${quizData.length}`;

            optionsContainer.innerHTML = "";
            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            // Start Timer safely
            timerInterval = setInterval(() => {
                timeLeft--;
                timerTxt.innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoShowAnswer(); 
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex, btnElement) {
            clearInterval(timerInterval); // অপশনে ক্লিক করলেই টাইমার থেমে যাবে!
            
            let correctIndex = quizData[currentQIndex].answer;
            let allBtns = optionsContainer.children;

            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].classList.add("disabled");
                if (i === correctIndex) {
                    allBtns[i].classList.add("correct"); 
                }
            }

            if (selectedIndex === correctIndex) {
                score++;
                scoreTxt.innerText = score;
            } else {
                btnElement.classList.add("wrong");
            }

            nextBtn.style.visibility = "visible";
        }

        function autoShowAnswer() {
            let correctIndex = quizData[currentQIndex].answer;
            let allBtns = optionsContainer.children;

            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].classList.add("disabled");
                if (i === correctIndex) {
                    allBtns[i].classList.add("correct"); 
                }
            }
            nextBtn.style.visibility = "visible";
        }

        function goNext() {
            currentQIndex++;
            if (currentQIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quiz-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "block";
            document.getElementById("final-score-text").innerText = `${score} / ${quizData.length}`;
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
