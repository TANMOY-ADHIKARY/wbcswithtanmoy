    <style>
        /* ===================================================
           DEEP VIBRANT PORTAL (100% FIXED - NO SCROLL JUMPS)
        =================================================== */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }

        body { background: #eaf0f6; }

        .quiz-super-container {
            width: 94%;
            max-width: 960px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 4px solid #ced6e0;
            overflow: hidden;
        }

        /* Top Bar - Deep Dark Navy */
        .quiz-header-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #0a183d; 
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d63031;
        }

        /* সলিড কড়া রঙের ব্যাজ */
        .timer-badge {
            background: #ff4757;
            color: white;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .question-tracker {
            background: #1e90ff;
            color: white;
            font-weight: 900;
            padding: 8px 22px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .score-badge {
            background: #009432;
            color: white;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .quiz-body { padding: 35px 40px; }

        /* কড়া ডিপ স্যাফায়ার নেভি ব্লু প্রশ্ন বক্স */
        .question-display-card {
            background: #0c2461;
            color: #ffffff;
            border: 4px solid #4a69bd;
            padding: 25px 30px;
            border-radius: 16px;
            font-size: 23px;
            font-weight: 900;
            margin-bottom: 35px;
            line-height: 1.5;
            box-shadow: 0 8px 20px rgba(12, 36, 97, 0.4);
        }

        /* অপশন গ্রিড */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 20px;
        }

        /* সাধারণ অপশন বক্স */
        .option-item {
            background: #ffffff;
            border: 3px solid #70a1ff;
            border-left: 8px solid #1e90ff;
            padding: 18px 22px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 800;
            color: #2f3542;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* কড়া সবুজ (Correct) */
        .opt-correct {
            background: #009432 !important;
            color: white !important;
            border: 3px solid #004015 !important;
            border-left: 8px solid #00260c !important;
            box-shadow: 0 6px 15px rgba(0, 148, 50, 0.4) !important;
        }

        /* কড়া লাল (Wrong) */
        .opt-wrong {
            background: #d63031 !important;
            color: white !important;
            border: 3px solid #801d1d !important;
            border-left: 8px solid #4d1111 !important;
            box-shadow: 0 6px 15px rgba(214, 48, 49, 0.4) !important;
        }

        .disabled-opt { pointer-events: none; }

        .quiz-footer { margin-top: 40px; padding-top: 20px; }

        /* স্থায়ী কড়া লাল Next বাটন */
        .next-action-btn {
            width: 100%;
            background: #d63031;
            color: white;
            border: none;
            border-bottom: 5px solid #8c1d1d; 
            padding: 18px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            display: block; 
            box-shadow: 0 8px 20px rgba(214, 48, 49, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .next-action-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* Result Screen */
        .result-container { display: none; text-align: center; padding: 80px 20px; }
        .result-container h2 { font-size: 35px; color: #0c2461; font-weight:900; margin-bottom: 20px; }
        .result-score-txt { font-size: 65px; font-weight: 900; color: #009432; margin-bottom: 35px; }

        /* ===================================================
           MOBILE VIEW (< 768px)
        =================================================== */
        @media screen and (max-width: 768px) {
            .quiz-super-container { width: 100%; margin: 0 auto; border-radius: 0; border: none; }
            .quiz-header-bar { padding: 14px 15px; }
            .timer-badge, .question-tracker, .score-badge { padding: 6px 12px; font-size: 15px; }
            
            .quiz-body { padding: 25px 18px; }
            .question-display-card { font-size: 20px; padding: 20px; margin-bottom: 25px; }
            
            .options-grid { grid-template-columns: 1fr; gap: 14px; }
            .option-item { padding: 16px 20px; font-size: 17px; }
            
            .next-action-btn { padding: 16px; font-size: 18px; }
        }
    </style>
</head>

        let currentIndex = 0;
        let userScore = 0;
        let timeLeft = 30;
        let activeTimer;

        const qTxtEl = document.getElementById("q-txt");
        const optsAreaEl = document.getElementById("opts-area");
        const timeTxtEl = document.getElementById("time-txt");
        const trackerTxtEl = document.getElementById("tracker-txt");
        const scoreTxtEl = document.getElementById("score-txt");

        function renderQuestion() {
            clearInterval(activeTimer);
            timeLeft = 30;
            timeTxtEl.innerText = timeLeft;

            const currentQ = questionsList[currentIndex];
            qTxtEl.innerText = currentQ.question;
            trackerTxtEl.innerText = `প্রশ্ন: ${currentIndex + 1} / ${questionsList.length}`;

            optsAreaEl.innerHTML = "";
            currentQ.options.forEach((optText, i) => {
                const optDiv = document.createElement("div");
                optDiv.className = "option-item";
                optDiv.innerHTML = `<span>${optText}</span> <span class="icon-holder"></span>`;
                optDiv.onclick = () => validateAnswer(i, optDiv);
                optsAreaEl.appendChild(optDiv);
            });

            activeTimer = setInterval(() => {
                timeLeft--;
                timeTxtEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(activeTimer);
                    revealCorrectOnly();
                }
            }, 1000);
        }

        function validateAnswer(selectedIdx, clickedEl) {
            clearInterval(activeTimer);
            const correctIdx = questionsList[currentIndex].correct;
            const allOptions = optsAreaEl.children;

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add("disabled-opt");
                if (i === correctIdx) {
                    allOptions[i].classList.add("opt-correct");
                    allOptions[i].querySelector(".icon-holder").innerText = "✔";
                }
            }

            if (selectedIdx === correctIdx) {
                userScore++;
                scoreTxtEl.innerText = userScore;
            } else {
                clickedEl.classList.add("opt-wrong");
                clickedEl.querySelector(".icon-holder").innerText = "✖";
            }
        }

        function revealCorrectOnly() {
            const correctIdx = questionsList[currentIndex].correct;
            const allOptions = optsAreaEl.children;
            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add("disabled-opt");
                if (i === correctIdx) {
                    allOptions[i].classList.add("opt-correct");
                    allOptions[i].querySelector(".icon-holder").innerText = "✔";
                }
            }
        }

        function triggerNext() {
            currentIndex++;
            if (currentIndex < questionsList.length) {
                renderQuestion();
                // অটো-স্লাইড করার কোড সমূলে বিনাশ করা হয়েছে! 
            } else {
                document.getElementById("active-quiz-portal").style.display = "none";
                document.getElementById("result-portal").style.display = "block";
                document.getElementById("final-score-display").innerText = `${userScore} / ${questionsList.length}`;
            }
        }

        window.onload = renderQuestion;
    </script>
</body>
</html>
