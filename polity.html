<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Polity Mock Test - WBCS With Tanmoy</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* ===================================================
           ULTRA-GLOSSY "CHOK-CHOKE" ASSESSMENT PORTAL
        =================================================== */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body { background: #ebf0f5; margin: 0; padding: 0; }

        /* মূল কন্টেইনার */
        .quiz-super-container {
            width: 94%;
            max-width: 980px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            border: 3px solid #dfe6e9;
            overflow: hidden;
        }

        /* Top Bar (Sticky & High Contrast) */
        .quiz-header-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #1e272e; /* গাঢ় ডার্ক হেডার */
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #ff4757;
        }

        /* চকচকে নিয়ন ব্যাজগুলো */
        .timer-badge {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
            letter-spacing: 1px;
        }

        .question-tracker {
            background: linear-gradient(135deg, #1e90ff 0%, #70a1ff 100%);
            color: white;
            font-weight: 900;
            padding: 8px 22px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 0 12px rgba(30, 144, 255, 0.6);
        }

        .score-badge {
            background: linear-gradient(135deg, #2ed573 0%, #7bed9f 100%);
            color: white;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 0 12px rgba(46, 213, 115, 0.6);
        }

        /* Main Question Area */
        .quiz-body { padding: 35px 40px; }

        /* চকচকে রয়্যাল ব্লু প্রশ্ন কার্ড */
        .question-display-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            border: 2px solid #74b9ff;
            padding: 25px 30px;
            border-radius: 16px;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 35px;
            line-height: 1.5;
            box-shadow: 0 10px 25px rgba(30, 60, 114, 0.35);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* অপশন গ্রিড: ল্যাপটপে ২x২, মোবাইলে ১x৪ */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 20px;
        }

        /* গ্লসি অপশন বোতাম */
        .option-item {
            background: #ffffff;
            border: 3px solid #ced6e0;
            border-left: 8px solid #3742fa; /* সুন্দর নীল সাইডবার ল্যাম্প */
            padding: 18px 22px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 800;
            color: #2f3542;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        .option-item:hover {
            background: #f1f2f6;
            border-color: #3742fa;
            transform: scale(1.01);
        }

        /* কড়া সবুজ ও লাল (Correct / Wrong) */
        .opt-correct {
            background: linear-gradient(135deg, #00b09b, #96c93d) !important;
            color: white !important;
            border: none !important;
            box-shadow: 0 8px 20px rgba(0, 176, 155, 0.5) !important;
        }

        .opt-wrong {
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%) !important;
            color: white !important;
            border: none !important;
            box-shadow: 0 8px 20px rgba(255, 8, 68, 0.5) !important;
        }

        .disabled-opt { pointer-events: none; }

        /* Action Footer */
        .quiz-footer {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 3px dashed #dfe6e9;
            display: flex;
            justify-content: flex-end;
        }

        /* চকচকে স্থায়ী Next বাটন (কখনো গায়েব হবে না) */
        .next-action-btn {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
            border: 2px solid #ffffff;
            padding: 16px 45px;
            border-radius: 30px;
            font-size: 19px;
            font-weight: 900;
            cursor: pointer;
            display: block; /* ম্যাজিক: সবসময় স্ক্রিনে থাকবে */
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .next-action-btn:hover {
            background: linear-gradient(135deg, #ff6b81 0%, #ff4757 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.7);
        }

        .next-action-btn:active { transform: translateY(1px); }

        /* Result Screen */
        .result-container {
            display: none;
            text-align: center;
            padding: 80px 20px;
        }
        .result-container h2 { font-size: 34px; color: #2d3748; font-weight:900; margin-bottom: 20px; }
        .result-score-txt { font-size: 60px; font-weight: 900; color: #2ed573; margin-bottom: 35px; text-shadow: 0 4px 10px rgba(46, 213, 115, 0.3); }

        /* ===================================================
           MOBILE VIEW ADJUSTMENTS (< 768px)
        =================================================== */
        @media screen and (max-width: 768px) {
            .quiz-super-container { width: 100%; margin: 0 auto; border-radius: 0; border: none; }
            .quiz-header-bar { padding: 14px 15px; }
            .timer-badge, .question-tracker, .score-badge { padding: 6px 12px; font-size: 14px; }
            
            .quiz-body { padding: 25px 18px; }
            .question-display-card { font-size: 20px; padding: 20px; margin-bottom: 25px; }
            
            .options-grid { grid-template-columns: 1fr; gap: 14px; }
            .option-item { padding: 16px 20px; font-size: 16px; border-left-width: 6px; }
            
            .quiz-footer { justify-content: center; }
            .next-action-btn { width: 100%; padding: 16px; text-align: center; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <img src="logo.png" alt="Wbcs with Tanmoy" class="top-logo" onerror="this.style.display='none'">
        <h1 class="main-title">WBCS WITH TANMOY</h1>
    </header>

    <div class="site-info-bar">
        <span>📅 Estd: 19.06.2026</span>
        <span class="separator">|</span>
        <span>📍 Alipurduar</span>
    </div>

    <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="index.html">Notes</a>
        <a href="https://drive.google.com/drive/folders/1xMzQB4SyceBRpZ4D2lC6p97Y64Jwjamy?usp=drive_link" target="_blank">Syllabus</a>
        <a href="https://drive.google.com/drive/folders/1nXT_2jDf4UpzG0d_zwPrDGf4nYcMUpVm?usp=sharing" target="_blank">Pyq</a>
        <a href="https://drive.google.com/drive/folders/1oF85zmZwjae4ZLavy61dbq8Eda19Eksd?usp=drive_link" target="_blank">Books</a>
        <a href="mocktest.html" style="color: #e74c3c;">Mock Test</a>
    </nav>

    <div class="quiz-super-container">
        
        <div id="active-quiz-portal">
            <div class="quiz-header-bar">
                <div class="timer-badge">⏱ <span id="time-txt">30</span>s</div>
                <div class="question-tracker" id="tracker-txt">প্রশ্ন: ১ / ৩</div>
                <div class="score-badge">Score: <span id="score-txt">0</span></div>
            </div>

            <div class="quiz-body">
                <div class="question-display-card" id="q-txt"></div>
                
                <div class="options-grid" id="opts-area"></div>

                <div class="quiz-footer">
                    <button class="next-action-btn" id="nxt-btn" onclick="triggerNext()">পরের প্রশ্ন ➔</button>
                </div>
            </div>
        </div>

        <div class="result-container" id="result-portal">
            <h2>মক টেস্ট সমাপ্ত! 🎉</h2>
            <div class="result-score-txt" id="final-score-display">0 / 0</div>
            <a href="mocktest.html" style="background:linear-gradient(135deg, #1e90ff, #ff4757); color:white; padding:16px 45px; border-radius:30px; text-decoration:none; font-weight:900; font-size:18px; display:inline-block; box-shadow:0 8px 20px rgba(0,0,0,0.2);">মেইন মেনু</a>
        </div>

    </div>

    <script>
        // তোমার প্রশ্নমালা
        const questionsList = [
            {
                question: "১. গণপরিষদের প্রথম অস্থায়ী সভাপতি কে ছিলেন?",
                options: ["ডঃ সচ্চিদানন্দ সিনহা", "ডঃ রাজেন্দ্র প্রসাদ", "ডঃ বি. আর. আম্বেদকর", "জওহরলাল নেহেরু"],
                correct: 0
            },
            {
                question: "২. ভারতের সংবিধান কবে গৃহীত হয়?",
                options: ["২৬ শে জানুয়ারি, ১৯৫০", "২৬ শে নভেম্বর, ১৯৪৯", "১৫ ই আগস্ট, ১৯৪৭", "২৪ শে জানুয়ারি, ১৯৫০"],
                correct: 1
            },
            {
                question: "৩. ভারতীয় সংবিধানের খসড়া কমিটির চেয়ারম্যান কে ছিলেন?",
                options: ["মহাত্মা গান্ধী", "সর্দার বল্লভভাই প্যাটেল", "ডঃ বি. আর. আম্বেদকর", "ডঃ রাজেন্দ্র প্রসাদ"],
                correct: 2
            }
        ];

        let currentIndex = 0;
        let userScore = 0;
        let timeLeft = 30;
        let activeTimer;

        const qTxtEl = document.getElementById("q-txt");
        const optsAreaEl = document.getElementById("opts-area");
        const timeTxtEl = document.getElementById("time-txt");
        const trackerTxtEl = document.getElementById("tracker-txt");
        const scoreTxtEl = document.getElementById("score-txt");

        function renderQuestion() {
            clearInterval(activeTimer);
            timeLeft = 30;
            timeTxtEl.innerText = timeLeft;

            // নেক্সট বাটন লুকানোর কোনো লজিক আর এখানে নেই! ওটা সবসময় থাকবে।

            const currentQ = questionsList[currentIndex];
            qTxtEl.innerText = currentQ.question;
            trackerTxtEl.innerText = `প্রশ্ন: ${currentIndex + 1} / ${questionsList.length}`;

            optsAreaEl.innerHTML = "";
            currentQ.options.forEach((optText, i) => {
                const optDiv = document.createElement("div");
                optDiv.className = "option-item";
                optDiv.innerHTML = `<span>${optText}</span> <span class="icon-holder"></span>`;
                optDiv.onclick = () => validateAnswer(i, optDiv);
                optsAreaEl.appendChild(optDiv);
            });

            activeTimer = setInterval(() => {
                timeLeft--;
                timeTxtEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(activeTimer);
                    revealCorrectOnly();
                }
            }, 1000);
        }

        function validateAnswer(selectedIdx, clickedEl) {
            clearInterval(activeTimer);
            const correctIdx = questionsList[currentIndex].correct;
            const allOptions = optsAreaEl.children;

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add("disabled-opt");
                if (i === correctIdx) {
                    allOptions[i].classList.add("opt-correct");
                    allOptions[i].querySelector(".icon-holder").innerText = "✔";
                }
            }

            if (selectedIdx === correctIdx) {
                userScore++;
                scoreTxtEl.innerText = userScore;
            } else {
                clickedEl.classList.add("opt-wrong");
                clickedEl.querySelector(".icon-holder").innerText = "✖";
            }
        }

        function revealCorrectOnly() {
            const correctIdx = questionsList[currentIndex].correct;
            const allOptions = optsAreaEl.children;
            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add("disabled-opt");
                if (i === correctIdx) {
                    allOptions[i].classList.add("opt-correct");
                    allOptions[i].querySelector(".icon-holder").innerText = "✔";
                }
            }
        }

        function triggerNext() {
            currentIndex++;
            if (currentIndex < questionsList.length) {
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                document.getElementById("active-quiz-portal").style.display = "none";
                document.getElementById("result-portal").style.display = "block";
                document.getElementById("final-score-display").innerText = `${userScore} / ${questionsList.length}`;
            }
        }

        window.onload = renderQuestion;
    </script>
</body>
</html>
