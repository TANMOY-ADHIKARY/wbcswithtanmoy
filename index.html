<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wbcs With Tanmoy</title>
    <link rel="stylesheet" href="style.css">
</head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<body>
   <body>
    <!-- <body> ট্যাগের ঠিক নিচে এই পুরো অংশটুকু পেস্ট করুন -->
    <header class="top-header">
    <!-- বাঁ-দিকের লোগো -->
    <img src="logo.png" alt="Wbcs with Tanmoy" class="top-logo">

    <!-- মাঝখানের নাম -->
    <h1 class="main-title">WBCS WITH TANMOY</h1>

    <!-- ডানদিকের মেনু -->
    <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="#">Notes</a>
        <a href="mocktest.html">Mock Test</a>
    </nav>
</header>
    
    <div class="container">
        <!-- Left Sidebar (Syllabus) -->
        <aside>
            <h3>Wbcs Syllabus</h3>
            <ul id="menu-list">
                <li class="active" onclick="changeSubject('Polity', this)">Indian Polity</li>
                <li onclick="changeSubject('History', this)">History of India</li>
                <li onclick="changeSubject('Geography', this)">Indian Geography</li>
                <li onclick="changeSubject('Science', this)">General Science</li>
                <li onclick="changeSubject('Science', this)">General English</li>
            </ul>
        </aside>
        
        <!-- Main Content Area -->
        <main id="content-area">
            <h1>Indian Polity Notes</h1>
            <div class="note-box">
                <h2>Chapter 1: Making of the Constitution</h2>
                <p>Coming Soon...</p>
            </div>
        </main>
    </div>

    <!-- JavaScript code (Sidebar ke active korar jonno) -->
    <script>
        function changeSubject(subjectName, clickedElement) {
            // 1. Sob gulo menu theke blue color (active) soriye nibe
            let allItems = document.querySelectorAll('#menu-list li');
            allItems.forEach(item => item.classList.remove('active'));

            // 2. Jei menu te click korecho, setate blue color (active) add korbe
            clickedElement.classList.add('active');

            // 3. Main content area ke dhorbe
            let contentArea = document.getElementById('content-area');

            // 4. Click kora subject onujayi pora change korbe
            if (subjectName === 'Polity') {
                contentArea.innerHTML = `
                    <h1>Indian Polity Notes</h1>
                    <div class="note-box">
                        <h2>Chapter 1: Making of the Constitution</h2>
                        <p>Coming Soon...</p>
                    </div>
                `;
            } else if (subjectName === 'History') {
                contentArea.innerHTML = `
                    <h1>History of India</h1>
                    <div class="note-box">
                        <h2>Chapter 1: Indus Valley Civilization</h2>
                        <p>Coming Soon...</p>


                        
                    </div>
                `;
            } else if (subjectName === 'Geography') {
                contentArea.innerHTML = `
                    <h1>Indian Geography</h1>
                    <div class="note-box">
                        <h2>Chapter 1: Physical Features of India</h2>
                        <p>Coming Soon...</p>
                        
                    </div>
                `;
            } else if (subjectName === 'Science') {
                contentArea.innerHTML = `
                    <h1>General Science</h1>
                    <div class="note-box">
                        <h2>Chapter 1: Physics & Chemistry basics</h2>
                        <p>Coming Soon...</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
