<body>
    <header class="top-header">
        <img src="logo.png" alt="Wbcs with Tanmoy" class="top-logo">
        <h1 class="main-title">WBCS WITH TANMOY</h1>
        
        <nav class="top-nav">
            <!-- ডার্ক মোড বাটন -->
            <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
            <a href="index.html">Home</a>
            <a href="#">Notes</a>
            <a href="mocktest.html">Mock Test</a>
        </nav>
    </header>
    
    <div class="container">
        <aside>
            <h3>Wbcs Syllabus</h3>
            <ul id="menu-list">
                <li class="active" onclick="changeSubject('Polity', this)">Indian Polity</li>
                <li onclick="changeSubject('History', this)">History of India</li>
                <li onclick="changeSubject('Geography', this)">Indian Geography</li>
                <li onclick="changeSubject('Science', this)">General Science</li>

            </ul>
        </aside>
        
        <main id="content-area">
            <h1>Indian Polity Notes</h1>
            <div class="note-box">
                <h2>Chapter 1: Making of the Constitution</h2>
                <p>Coming Soon...</p>
            </div>
        </main>
    </div>

    <script>
        // ডার্ক মোড ফাংশন
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('theme-toggle');
            if (document.body.classList.contains('dark-mode')) {
                btn.innerText = "☀️ Light Mode";
            } else {
                btn.innerText = "🌙 Dark Mode";
            }
        }

        // সাইডবার লজিক
        function changeSubject(subjectName, clickedElement) {
            let allItems = document.querySelectorAll('#menu-list li');
            allItems.forEach(item => item.classList.remove('active'));
            clickedElement.classList.add('active');
            
            let contentArea = document.getElementById('content-area');
            // তোমার আগের লজিক এখানে লিখবে...
        }
    </script>
</body>
</html>
