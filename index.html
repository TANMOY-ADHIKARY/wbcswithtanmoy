<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wbcs With Tanmoy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-header">
        <h1>WBCS WITH TANMOY</h1>
        <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    </header>

    <div class="container">
        <aside>
            <h3>Syllabus</h3>
            <ul id="menu-list">
                <li onclick="changeSubject('Polity', this)">Indian Polity</li>
            </ul>
        </aside>
        
        <main id="content-area">
            <div class="note-box">
                <h2>Welcome</h2>
                <p>Click to see notes.</p>
            </div>
        </main>
    </div>

    <script>
        function toggleTheme() {
            // বডিতে ডার্ক মোড ক্লাস যোগ বা বিয়োগ করছে
            document.body.classList.toggle('dark-mode');
            
            // বাটনের টেক্সট পরিবর্তন
            const btn = document.getElementById('theme-toggle');
            if (document.body.classList.contains('dark-mode')) {
                btn.innerText = "☀️ Light Mode";
            } else {
                btn.innerText = "🌙 Dark Mode";
            }
        }

        function changeSubject(subjectName, clickedElement) {
            let contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `<h1>${subjectName} Notes</h1><div class="note-box"><h2>Chapter 1</h2><p>Coming Soon...</p></div>`;
        }
    </script>
</body>
</html>
