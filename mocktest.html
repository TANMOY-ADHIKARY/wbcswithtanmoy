<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test - WBCS with Tanmoy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* আধুনিক UI ডিজাইন */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            color: #2f3542;
            margin-top: 0;
        }
        .timer {
            font-size: 18px;
            color: #ff4757;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .question {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2f3542;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            padding: 12px;
            border: 1px solid #dfe4ea;
            background: #f1f2f6;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .option-btn:hover {
            background: #1e90ff;
            color: #ffffff;
            border-color: #1e90ff;
        }
        #result {
            display: none;
            font-size: 24px;
            font-weight: bold;
            color: #2ed573;
        }
        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2f3542;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h2>WBCS Mock Test</h2>
        
        <div id="quiz-area">
            <div class="timer" id="time">সময় বাকি: 30s</div>
            <div class="question" id="question">প্রশ্ন এখানে দেখাবে</div>
            <div class="options" id="options">
                </div>
        </div>

        <div id="result">
            </div>
        <a href="index.html" class="home-btn" id="home-btn" style="display: none;">হোমে ফিরে যান</a>
    </div>

    <script>
        const quizData = [
            // ইতিহাস (History)
            { question: "১. সিন্ধু সভ্যতার আবিষ্কারক কে?", options: ["দয়ারাম সাহানি", "রাখালদাস বন্দ্যোপাধ্যায়", "আলেকজান্ডার কানিংহাম", "জন মার্শাল"], answer: "দয়ারাম সাহানি" },
            { question: "২. 'ইন্ডিকা' গ্রন্থটি কে রচনা করেন?", options: ["ফাহিয়েন", "হিউয়েন সাং", "মেগাস্থিনিস", "কৌটিল্য"], answer: "মেগাস্থিনিস" },
            { question: "৩. গুপ্ত বংশের প্রতিষ্ঠাতা কে ছিলেন?", options: ["প্রথম চন্দ্রগুপ্ত", "সমুদ্রগুপ্ত", "শ্রীগুপ্ত", "স্কন্দগুপ্ত"], answer: "শ্রীগুপ্ত" },
            { question: "৪. ভারতের নেপোলিয়ন কাকে বলা হয়?", options: ["অশোক", "সমুদ্রগুপ্ত", "দ্বিতীয় চন্দ্রগুপ্ত", "হর্ষবর্ধন"], answer: "সমুদ্রগুপ্ত" },
            { question: "৫. পানিপথের প্রথম যুদ্ধ কবে হয়েছিল?", options: ["১৫২৬ সালে", "১৫৫৬ সালে", "১৭৬১ সালে", "১৭৫৭ সালে"], answer: "১৫২৬ সালে" },
            { question: "৬. 'দ্বীন-ই-ইলাহী' কে প্রবর্তন করেন?", options: ["বাবর", "হুমায়ুন", "আকবর", "শাহজাহান"], answer: "আকবর" },
            { question: "৭. সিপাহী বিদ্রোহ কবে শুরু হয়?", options: ["১৮৫৭ সালে", "১৮৮৫ সালে", "১৯০৫ সালে", "১৯৪২ সালে"], answer: "১৮৫৭ সালে" },
            { question: "৮. জাতীয় কংগ্রেসের প্রথম সভাপতি কে ছিলেন?", options: ["অ্যালান অক্টাভিয়ান হিউম", "উমেশচন্দ্র বন্দ্যোপাধ্যায়", "দাদাভাই নওরোজি", "সুরেন্দ্রনাথ বন্দ্যোপাধ্যায়"], answer: "উমেশচন্দ্র বন্দ্যোপাধ্যায়" },
            { question: "৯. 'স্বরাজ আমার জন্মগত অধিকার' - কার উক্তি?", options: ["মহাত্মা গান্ধী", "নেতাজি সুভাষচন্দ্র বসু", "ভগত সিং", "বাল গঙ্গাধর তিলক"], answer: "বাল গঙ্গাধর তিলক" },
            { question: "১০. জালিয়ানওয়ালাবাগের হত্যাকাণ্ড কবে ঘটে?", options: ["১৯১৯ সালে", "১৯২০ সালে", "১৯২২ সালে", "১৯৩০ সালে"], answer: "১৯১৯ সালে" },

            // ভূগোল (Geography)
            { question: "১১. আয়তনে ভারত পৃথিবীর কততম দেশ?", options: ["পঞ্চম", "ষষ্ঠ", "সপ্তম", "অষ্টম"], answer: "সপ্তম" },
            { question: "১২. ভারতের সর্বোচ্চ শৃঙ্গ কোনটি?", options: ["কাঞ্চনজঙ্ঘা", "মাউন্ট এভারেস্ট", "গডউইন অস্টিন (K2)", "নন্দাদেবী"], answer: "গডউইন অস্টিন (K2)" },
            { question: "১৩. পশ্চিমবঙ্গের সর্বোচ্চ শৃঙ্গ কোনটি?", options: ["ফালুট", "সান্দাকফু", "টাইগার হিল", "সবরগ্রাম"], answer: "সান্দাকফু" },
            { question: "১৪. সুন্দরবন কত সালে 'ওয়ার্ল্ড হেরিটেজ সাইট' আখ্যা পায়?", options: ["১৯৮৪", "১৯৮৭", "১৯৮৯", "১৯৯৭"], answer: "১৯৮৭" },
            { question: "১৫. ভারতের কোন রাজ্যে সবচেয়ে বেশি বনভূমি আছে?", options: ["মহারাষ্ট্র", "অরুণাচল প্রদেশ", "ছত্তিশগড়", "মধ্যপ্রদেশ"], answer: "মধ্যপ্রদেশ" },
            { question: "১৬. দামোদর নদ কোথা থেকে উৎপন্ন হয়েছে?", options: ["ছোটনাগপুর মালভূমি", "হিমালয় পর্বত", "আরাবল্লী পর্বত", "পূর্বঘাট পর্বতমালা"], answer: "ছোটনাগপুর মালভূমি" },
            { question: "১৭. ভারতের দীর্ঘতম নদী কোনটি?", options: ["ব্রহ্মপুত্র", "গঙ্গা", "গোদাবরী", "যমুনা"], answer: "গঙ্গা" },
            { question: "১৮. মাজুলী নদীদ্বীপ কোথায় অবস্থিত?", options: ["পশ্চিমবঙ্গ", "ওড়িশা", "আসাম", "কেরালা"], answer: "আসাম" },
            { question: "১৯. ভারতের ম্যানচেস্টার কাকে বলা হয়?", options: ["মুম্বাই", "আহমেদাবাদ", "সুরাট", "কানপুর"], answer: "আহমেদাবাদ" },
            { question: "২০. পশ্চিমবঙ্গের কোন জেলায় সবচেয়ে বেশি বৃষ্টিপাত হয়?", options: ["দার্জিলিং", "জলপাইগুড়ি", "আলিপুরদুয়ার", "কোচবিহার"], answer: "আলিপুরদুয়ার" },

            // ভারতীয় সংবিধান (Indian Polity)
            { question: "২১. ভারতের সংবিধান কবে কার্যকর হয়?", options: ["১৫ আগস্ট ১৯৪৭", "২৬ নভেম্বর ১৯৪৯", "২৬ জানুয়ারি ১৯৫০", "২ অক্টোবর ১৯৫০"], answer: "২৬ জানুয়ারি ১৯৫০" },
            { question: "২২. গণপরিষদের খসড়া কমিটির চেয়ারম্যান কে ছিলেন?", options: ["জওহরলাল নেহেরু", "ড. রাজেন্দ্র প্রসাদ", "বি. আর. আম্বেদকর", "সর্দার বল্লভভাই প্যাটেল"], answer: "বি. আর. আম্বেদকর" },
            { question: "২৩. ভারতের রাষ্ট্রপতি হতে গেলে ন্যূনতম বয়স কত হতে হবে?", options: ["২৫ বছর", "৩০ বছর", "৩৫ বছর", "৪০ বছর"], answer: "৩৫ বছর" },
            { question: "২৪. লোকসভার সর্বোচ্চ সদস্য সংখ্যা কত হতে পারে?", options: ["৫৪৩", "৫৪৫", "৫৫০", "৫৫২"], answer: "৫৫২" },
            { question: "২৫. পঞ্চায়েত রাজ ব্যবস্থা প্রথম কোন রাজ্যে চালু হয়?", options: ["গুজরাট", "রাজস্থান", "অন্ধ্রপ্রদেশ", "মহারাষ্ট্র"], answer: "রাজস্থান" },
            { question: "২৬. সুপ্রিম কোর্টের বিচারপতিদের অবসরের বয়স কত?", options: ["৬০ বছর", "৬২ বছর", "৬৫ বছর", "৭০ বছর"], answer: "৬৫ বছর" },
            { question: "২৭. 'মৌলিক অধিকার' সংবিধানের কোন অংশে আছে?", options: ["দ্বিতীয় অংশ", "তৃতীয় অংশ", "চতুর্থ অংশ", "পঞ্চম অংশ"], answer: "তৃতীয় অংশ" },
            { question: "২৮. অর্থ বিল কেবল কোথায় উত্থাপন করা যায়?", options: ["রাজ্যসভায়", "লোকসভায়", "বিধানসভায়", "যেকোনো কক্ষে"], answer: "লোকসভায়" },
            { question: "২৯. ভারতের প্রথম নাগরিক কাকে বলা হয়?", options: ["প্রধানমন্ত্রী", "সুপ্রিম কোর্টের প্রধান বিচারপতি", "রাষ্ট্রপতি", "লোকসভার স্পিকার"], answer: "রাষ্ট্রপতি" },
            { question: "৩০. নির্বাচন কমিশনের গঠন সম্পর্কে কোন ধারায় বলা হয়েছে?", options: ["২৮০ নম্বর ধারা", "৩১৫ নম্বর ধারা", "৩২৪ নম্বর ধারা", "৩৫২ নম্বর ধারা"], answer: "৩২৪ নম্বর ধারা" },

            // বিজ্ঞান (Science)
            { question: "৩১. মানবদেহের সবচেয়ে বড় গ্রন্থি কোনটি?", options: ["অগ্ন্যাশয়", "যকৃৎ (Liver)", "থাইরয়েড", "পিটুইটারি"], answer: "যকৃৎ (Liver)" },
            { question: "৩২. রক্ত জমাট বাঁধতে কোন ভিটামিন সাহায্য করে?", options: ["ভিটামিন A", "ভিটামিন B", "ভিটামিন C", "ভিটামিন K"], answer: "ভিটামিন K" },
            { question: "৩৩. শব্দের বেগ সবচেয়ে বেশি কোন মাধ্যমে?", options: ["কঠিন মাধ্যমে", "তরল মাধ্যমে", "গ্যাসীয় মাধ্যমে", "শূন্য মাধ্যমে"], answer: "কঠিন মাধ্যমে" },
            { question: "৩৪. কোষের 'শক্তিঘর' কাকে বলে?", options: ["রাইবোজোম", "লাইসোজোম", "মাইটোকনড্রিয়া", "নিউক্লিয়াস"], answer: "মাইটোকনড্রিয়া" },
            { question: "৩৫. 'পেনিসিলিন' কে আবিষ্কার করেন?", options: ["লুই পাস্তুর", "আলেকজান্ডার ফ্লেমিং", "রবার্ট হুক", "এডওয়ার্ড জেনার"], answer: "আলেকজান্ডার ফ্লেমিং" },
            { question: "৩৬. বায়ুমণ্ডলে কোন গ্যাস সবচেয়ে বেশি থাকে?", options: ["অক্সিজেন", "কার্বন ডাই অক্সাইড", "নাইট্রোজেন", "আর্গন"], answer: "নাইট্রোজেন" },
            { question: "৩৭. বৈদ্যুতিক বাতির ফিলামেন্ট কী দিয়ে তৈরি হয়?", options: ["লোহা", "তামা", "টাংস্টেন", "অ্যালুমিনিয়াম"], answer: "টাংস্টেন" },
            { question: "৩৮. মানবদেহে ক্রোমোজোমের সংখ্যা কত?", options: ["২২ জোড়া", "২৩ জোড়া", "২৪ জোড়া", "২৫ জোড়া"], answer: "২৩ জোড়া" },
            { question: "৩৯. লাফিং গ্যাস (Laughing Gas) এর রাসায়নিক নাম কী?", options: ["নাইট্রিক অক্সাইড", "নাইট্রাস অক্সাইড", "কার্বন মনোক্সাইড", "সালফার ডাই অক্সাইড"], answer: "নাইট্রাস অক্সাইড" },
            { question: "৪০. জলের স্ফুটনাঙ্ক কত?", options: ["০°C", "১০০°C", "২১২°C", "৩৭৩°C"], answer: "১০০°C" },

            // সাধারণ জ্ঞান ও অর্থনীতি (Static GK & Economy)
            { question: "৪১. রিজার্ভ ব্যাংক অফ ইন্ডিয়া (RBI) কবে প্রতিষ্ঠিত হয়?", options: ["১৯৩৫ সালে", "১৯৪৯ সালে", "১৯৫০ সালে", "১৯৫১ সালে"], answer: "১৯৩৫ সালে" },
            { question: "৪২. ভারতের প্রথম পঞ্চবার্ষিকী পরিকল্পনা কবে শুরু হয়?", options: ["১৯৪৭ সালে", "১৯৫০ সালে", "১৯৫১ সালে", "১৯৫৫ সালে"], answer: "১৯৫১ সালে" },
            { question: "৪৩. নোবেল পুরস্কার কয়টি বিষয়ে দেওয়া হয়?", options: ["৪টি", "৫টি", "৬টি", "৭টি"], answer: "৬টি" },
            { question: "৪৪. 'গীতাঞ্জলি' কাব্যগ্রন্থের জন্য রবীন্দ্রনাথ ঠাকুর কবে নোবেল পান?", options: ["১৯১১ সালে", "১৯১৩ সালে", "১৯১৫ সালে", "১৯১৯ সালে"], answer: "১৯১৩ সালে" },
            { question: "৪৫. বিশ্ব পরিবেশ দিবস কবে পালিত হয়?", options: ["৫ মে", "৫ জুন", "৫ জুলাই", "৫ আগস্ট"], answer: "৫ জুন" },
            { question: "৪৬. ভারতের প্রথম মহিলা প্রধানমন্ত্রী কে ছিলেন?", options: ["সরোজিনী নাইডু", "ইন্দিরা গান্ধী", "প্রতিভা পাতিল", "সুচেতা কৃপালনি"], answer: "ইন্দিরা গান্ধী" },
            { question: "৪৭. অলিম্পিকে ব্যক্তিগত ইভেন্টে প্রথম সোনা জয়ী ভারতীয় কে?", options: ["নীরজ চোপড়া", "অভিনব বিন্দ্রা", "সুশীল কুমার", "পি. ভি. সিন্ধু"], answer: "অভিনব বিন্দ্রা" },
            { question: "৪৮. 'ডিসকভারি অফ ইন্ডিয়া' বইটি কার লেখা?", options: ["মহাত্মা গান্ধী", "জওহরলাল নেহেরু", "ড. রাজেন্দ্র প্রসাদ", "অরুণাচল প্রদেশ"], answer: "জওহরলাল নেহেরু" },
            { question: "৪৯. আন্তর্জাতিক নারী দিবস কবে পালিত হয়?", options: ["৮ মার্চ", "১০ মার্চ", "১২ মে", "১৪ নভেম্বর"], answer: "৮ মার্চ" },
            { question: "৫০. ইসরো (ISRO) এর সদর দপ্তর কোথায় অবস্থিত?", options: ["দিল্লি", "মুম্বাই", "হায়দ্রাবাদ", "বেঙ্গালুরু"], answer: "বেঙ্গালুরু" }
        ];

        let currentQuiz = 0;
        let score = 0;
        let timeLeft = 30;
        let timer;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const timeEl = document.getElementById('time');
        const quizArea = document.getElementById('quiz-area');
        const resultEl = document.getElementById('result');
        const homeBtn = document.getElementById('home-btn');

        function loadQuiz() {
            clearInterval(timer);
            timeLeft = 30; 
            timeEl.innerText = `সময় বাকি: ${timeLeft}s`;
            
            optionsEl.innerHTML = '';
            const currentQuizData = quizData[currentQuiz];
            questionEl.innerText = currentQuizData.question;

            currentQuizData.options.forEach(option => {
                const button = document.createElement('button');
                button.innerText = option;
                button.classList.add('option-btn');
                button.onclick = () => selectOption(option);
                optionsEl.appendChild(button);
            });

            timer = setInterval(updateTime, 1000);
        }

        function updateTime() {
            timeLeft--;
            timeEl.innerText = `সময় বাকি: ${timeLeft}s`;
            if(timeLeft === 0) {
                clearInterval(timer);
                nextQuestion(); 
            }
        }

        function selectOption(selectedOption) {
            clearInterval(timer);
            if(selectedOption === quizData[currentQuiz].answer) {
                score++; 
            }
            nextQuestion();
        }

        function nextQuestion() {
            currentQuiz++;
            if(currentQuiz < quizData.length) {
                loadQuiz();
            } else {
                showResult(); 
            }
        }

        function showResult() {
            quizArea.style.display = 'none';
            resultEl.style.display = 'block';
            homeBtn.style.display = 'inline-block';
            resultEl.innerText = `মক টেস্ট শেষ! \nআপনার স্কোর: ${score} / ${quizData.length}`;
        }

        loadQuiz();
    </script>
</body>
</html>
