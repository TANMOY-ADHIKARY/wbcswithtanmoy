    let filteredQuiz = quizData;
    let currentQuiz = 0;
    let score = 0;
    let subjectScores = { "ইতিহাস": 0, "ভূগোল": 0, "সংবিধান": 0, "বিজ্ঞান": 0 };

    function filterQuestions() {
        const sub = document.getElementById('sub-list').value;
        filteredQuiz = (sub === "সব") ? quizData : quizData.filter(q => q.subject === sub);
        currentQuiz = 0; score = 0;
        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('result').style.display = 'none';
        loadQuiz();
    }

    function loadQuiz() {
        if(filteredQuiz.length === 0) {
            document.getElementById('question').innerText = "এই বিষয়ে কোনো প্রশ্ন নেই।";
            document.getElementById('options').innerHTML = "";
            return;
        }
        const q = filteredQuiz[currentQuiz];
        document.getElementById('question').innerText = q.question;
        const optionsEl = document.getElementById('options');
        optionsEl.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.classList.add('option-btn');
            btn.onclick = () => selectOption(btn, opt);
            optionsEl.appendChild(btn);
        });
    }

    function selectOption(btn, choice) {
        const correct = filteredQuiz[currentQuiz].answer;
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);
        if(choice === correct) {
            btn.style.backgroundColor = "#2ed573";
            score++;
            subjectScores[filteredQuiz[currentQuiz].subject]++;
        } else {
            btn.style.backgroundColor = "#ff4757";
            btns.forEach(b => { if(b.innerText === correct) b.style.backgroundColor = "#2ed573"; });
        }
        setTimeout(() => {
            currentQuiz++;
            if(currentQuiz < filteredQuiz.length) loadQuiz();
            else showResult();
        }, 1000);
    }

    function showResult() {
        document.getElementById('quiz-area').style.display = 'none';
        const res = document.getElementById('result');
        res.style.display = 'block';
        res.innerHTML = `মক টেস্ট শেষ!<br>মোট স্কোর: ${score}<br>বিষয়ভিত্তিক: ${JSON.stringify(subjectScores)}`;
        document.getElementById('home-btn').style.display = 'block';
    }

    loadQuiz();
</script>
